#fx0{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}

#s1 .kb{background:rgba(62,39,35,.9);border:1px solid #d7ccc8;top:14px;right:16px}
#s2{background:#3d5a3c;border:2px solid #78e08f}
#s3{height:auto}
#s4,#s5,#s6,#s7{background:#1e272e;border:1px solid #f1c40f;justify-content:flex-start;padding:38px 10px 42px;box-sizing:border-box}
.lg{font-size:40px;font-weight:700;color:#f1c40f;text-shadow:3px 3px 0 #c23616,0 0 18px rgba(255,107,129,.8);margin:-40px 0 30px}
.tg{position:absolute;top:10px;left:12px;font-size:15px;font-weight:700;color:#f1c40f}
.kb{position:absolute;top:10px;right:12px;font-size:13px;font-weight:700;color:#ffd32a;background:rgba(0,0,0,.5);padding:3px 9px;border-radius:10px}
.mb{padding:8px 14px;font-size:13px;font-weight:700;color:#fff;background:#c23616;border:2px solid #f1c40f;border-radius:8px;cursor:pointer}
.mb:disabled,.ub:disabled{background:#57606f;border-color:#7f8fa6;color:#a4b0be;cursor:default}
.nd{position:absolute;border-radius:50px;transform:translate(-50%,-50%);white-space:nowrap;line-height:1.15}
.bb{position:absolute;bottom:10px;left:10px;padding:5px 12px;font-size:12px;background:#57606f;color:#fff;border:1px solid #a4b0be;border-radius:4px;cursor:pointer}

canvas#cv{border:2px solid #fff;border-radius:6px;display:block;width:100%;height:210px}

.ub{flex:1;padding:8px 2px;font-size:12px;font-weight:700;color:#fff;background:#273c75;border:2px solid #f1c40f;border-radius:8px;cursor:pointer;line-height:1.3}
#ed{display:none;gap:10px;margin-top:8px}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;width:100%;overflow-y:auto;margin-top:6px}
.cd{background:#2f3640;border:2px solid #7f8fa6;border-radius:6px;padding:4px 2px;font-size:11px;cursor:pointer}
.cd.on{border-color:#f1c40f;background:#3d3d29}
.cd.lk{opacity:.45;cursor:default;background:#191e24}
.g10{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;width:100%;margin-top:8px}
.gc{background:#2f3640;border:1px solid #7f8fa6;border-radius:6px;padding:5px 2px;font-size:11px}
.ft{display:flex;gap:4px;margin-bottom:4px}
.fb{padding:3px 9px;font-size:11px;font-weight:700;background:#2f3640;color:#fff;border:1px solid #7f8fa6;border-radius:4px;cursor:pointer}

let actx,sndOn=1,bgmT,bgmM='';

function initAudio(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}
function tone(f,d,t='triangle',v=.15,sl=0,dl=0){
  if(!sndOn||!actx||!f)return;
  const n=actx.currentTime+dl,o=actx.createOscillator(),g=actx.createGain();
  o.type=t;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(sl,n+d);
  g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);
  o.connect(g);g.connect(actx.destination);o.start(n);o.stop(n+d);
}
function setBgm(m){
  if(bgmM===m&&bgmT)return;bgmM=m;clearInterval(bgmT);bgmT=null;if(!m||!sndOn)return;
  let st=0,mel='440,0,494,523,659,0,523,494,440,523,659,698,880,698,659,494'.split(',').map(Number);
  bgmT=setInterval(()=>{
    if(!sndOn||bgmM!==m)return;initAudio();
    if(m==='home'){let b=st++%3;if(!b){tone(110,.28,'sine',.28,48);tone(165,.12,'triangle',.12,70)}else if(b===1)tone(130,.24,'sine',.24,55)}
    else{let i=st++%16;if(i%2===0)tone(i%4?123.5:110,.14,'triangle',.16,65);if(mel.at(i))tone(mel.at(i),.15,'square',.06)}
  },m==='home'?460:175);
}
function toggleSound(){sndOn^=1;document.querySelectorAll('.snd').forEach(b=>b.textContent=sndOn?'🔊音ON':'🔇音OFF');if(!sndOn){clearInterval(bgmT);bgmT=null}else{let m=bgmM;bgmM='';setBgm(m)}}

const sparks=Array.from({length:55},()=>({x:Math.random()*700,y:Math.random()*350,r:1.5+Math.random()*3.5,vy:.8+Math.random()*2.2,vx:(Math.random()-.5)*1.2,a:.4+Math.random()*.6,c:Math.random()<.5?'#ffdd59':'#ff5e57'}));
(function fire(){
  if($('s0').classList.contains('on')){
    fctx.clearRect(0,0,700,350);let t=Date.now()*.004;
    for(let i=0;i<14;i++){let fx=i*55+Math.sin(t+i)*12,fh=75+Math.sin(t*1.5+i*1.7)*28,g=fctx.createRadialGradient(fx,350,5,fx,350-fh*.4,fh);g.addColorStop(0,'rgba(255,234,167,.85)');g.addColorStop(.5,'rgba(255,118,117,.45)');g.addColorStop(1,'rgba(214,48,49,0)');fctx.fillStyle=g;fctx.beginPath();fctx.arc(fx,350,fh,Math.PI,0);fctx.fill()}
    sparks.forEach(s=>{s.y-=s.vy;s.x+=s.vx+Math.sin(t+s.y*.03)*.5;if(s.y<-10){s.y=355;s.x=Math.random()*700}fctx.globalAlpha=s.a*(s.y/350);fctx.fillStyle=s.c;fctx.beginPath();fctx.arc(s.x,s.y,s.r,0,6.283);fctx.fill()});fctx.globalAlpha=1;
  }
  requestAnimationFrame(fire);
})();
