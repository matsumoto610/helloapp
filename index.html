<style>

  .kb { position: absolute; top: 10px; right: 12px; font-size: 13px; font-weight: bold; color: #ffd32a; background: rgba(0,0,0,.5); padding: 3px 9px; border-radius: 10px; }

  .bb { position: absolute; bottom: 10px; left: 10px; padding: 5px 12px; font-size: 12px; background: #57606f; color: #fff; border: 1px solid #a4b0be; border-radius: 4px; cursor: pointer; }
