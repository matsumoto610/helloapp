<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>戦国大戦争</title>
<style>
  body { margin: 0; background: #1e272e; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  #g { width: 720px; max-width: 96vw; background: #2f3640; border: 2px solid #f1c40f; border-radius: 10px; padding: 14px; box-sizing: border-box; text-align: center; }
  .s { display: none; height: 350px; flex-direction: column; justify-content: center; align-items: center; position: relative; border-radius: 8px; }
  .s.on { display: flex; }
  #s0 { background: radial-gradient(circle, #353b48, #1e272e); }
  #s1 { background: linear-gradient(135deg, #2c3e50, #1e272e); }
  #s2 { background: #3d5a3c; border: 2px solid #78e08f; }
  #s3 { height: auto; }
  #s4, #s5 { background: #1e272e; border: 1px solid #f1c40f; justify-content: flex-start; padding: 40px 10px 42px; box-sizing: border-box; }
  .lg { font-size: 40px; font-weight: bold; color: #f1c40f; text-shadow: 3px 3px 0 #c23616; margin: -40px 0 30px; }
  .tg { position: absolute; top: 10px; left: 12px; font-size: 15px; font-weight: bold; color: #f1c40f; }
  .kb { position: absolute; top: 10px; right: 12px; font-size: 13px; font-weight: bold; color: #ffd32a; background: rgba(0,0,0,0.5); padding: 3px 9px; border-radius: 10px; }
  .mb { padding: 10px 20px; font-size: 15px; font-weight: bold; color: #fff; background: #c23616; border: 2px solid #f1c40f; border-radius: 8px; cursor: pointer; }
  .mb:disabled { background: #57606f; border-color: #7f8fa6; color: #a4b0be; }
  .nd { position: absolute; border-radius: 50px; transform: translate(-50%, -50%); }
  .bb { position: absolute; bottom: 10px; left: 10px; padding: 5px 12px; font-size: 12px; background: #57606f; color: #fff; border: 1px solid #a4b0be; border-radius: 4px; cursor: pointer; }
  .br { width: 100%; box-sizing: border-box; display: flex; justify-content: space-between; background: #1e272e; padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 14px; margin-bottom: 6px; }
  canvas { border: 2px solid #fff; border-radius: 6px; display: block; width: 100%; height: 210px; }
  .bs { width: 100%; display: flex; gap: 6px; margin-top: 8px; }
  .ub { flex: 1; padding: 8px 2px; font-size: 12px; font-weight: bold; color: #fff; background: #273c75; border: 2px solid #f1c40f; border-radius: 8px; cursor: pointer; }
  .ub:disabled { background: #57606f; border-color: #7f8fa6; color: #a4b0be; }
  #ed { display: none; gap: 10px; margin-top: 8px; }
  .gr { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; width: 100%; overflow-y: auto; margin-top: 6px; }
  .cd { background: #2f3640; border: 2px solid #7f8fa6; border-radius: 6px; padding: 5px 2px; font-size: 11px; cursor: pointer; }
  .cd.on { border-color: #f1c40f; background: #3d3d29; }
</style>
</head>
<body>
<div id="g">
  <div id="s0" class="s on"><div class="lg">戦国大戦争</div><button class="mb" id="btn-start">出陣</button></div>
  <div id="s1" class="s">
    <div class="tg">本陣</div><div class="kb">小判:<span id="k1">300</span>両</div>
    <button class="mb" id="btn-map" style="position:absolute;top:30%;left:32%;transform:translate(-50%,-50%)">⚔️出陣</button>
    <button class="mb" id="btn-gacha" style="position:absolute;top:62%;left:32%;transform:translate(-50%,-50%);background:#8e44ad">🔮ガチャ</button>
    <button class="mb" id="btn-deck" style="position:absolute;top:62%;left:68%;transform:translate(-50%,-50%);background:#273c75">🛡️編成</button>
    <button class="bb" id="btn-title">タイトル</button>
  </div>
  <div id="s2" class="s">
    <div class="tg">合戦場(勝利+150両)</div>
    <button class="mb nd" id="st0" style="top:28%;left:24%;background:#2980b9">⚔️桶狭間</button>
    <button class="mb nd" id="st1" style="top:52%;left:50%">⚔️長篠</button>
    <button class="mb nd" id="st2" style="top:74%;left:76%;background:#6c3483">⚔️関ヶ原</button>
    <button class="bb" id="btn-home1">戻る</button>
  </div>
  <div id="s3" class="s">
    <div style="width:100%;display:flex;justify-content:space-between;margin-bottom:6px"><b id="bt" style="color:#f1c40f"></b><button class="bb" id="btn-quit" style="position:static">撤退</button></div>
    <div class="br"><span style="color:#ff6b81"><span id="en"></span>:<span id="eh"></span></span><span style="color:#f1c40f">資金:<span id="mn"></span>両</span><span style="color:#70a1ff">連合城:<span id="ph"></span></span></div>
    <canvas id="cv" width="700" height="220"></canvas>
    <div class="bs">
      <button class="ub" id="b0"></button><button class="ub" id="b1"></button>
      <button class="ub" id="b2"></button><button class="ub" id="b3"></button>
      <button class="ub" id="bp" style="background:#c23616" disabled>三段撃ち</button>
    </div>
    <div id="ed"><button class="mb" id="btn-retry">再戦</button><button class="mb" id="btn-tomap" style="background:#273c75">マップへ</button></div>
  </div>
  <div id="s4" class="s">
    <div class="tg">武将ガチャ(100両)</div><div class="kb">小判:<span id="k4">300</span>両</div>
    <div id="grs" style="margin:auto;font-size:17px;font-weight:bold">ボタンを押して召喚！</div>
    <button class="mb" id="gb" style="background:#8e44ad;margin-bottom:8px">ガチャを引く</button>
    <button class="bb" id="btn-home2">戻る</button>
  </div>
  <div id="s5" class="s">
    <div class="tg">部隊編成(4体まで)</div><div class="kb" id="dk"></div>
    <div id="pl" class="gr"></div>
    <button class="bb" id="btn-home3">戻る</button>
  </div>
</div>
<script>
const $ = i => document.getElementById(i);
const ctx = $('cv').getContext('2d');

const A = [
  { n:'徳川軍', r:'N', c:15, h:300, a:16, g:30, s:1.0, d:40, l:'#27ae60', b:'', t:'#fff', u:0, z:36, bs:0 },
  { n:'豊臣軍', r:'N', c:30, h:160, a:34, g:35, s:2.5, d:35, l:'#f1c40f', b:'', t:'#1e272e', u:0, z:36, bs:0 },
  { n:'織田軍', r:'N', c:50, h:100, a:48, g:185, s:1.1, d:50, l:'#8e44ad', b:'', t:'#fff', u:1, z:36, bs:0 },
  { n:'信長', r:'R', c:100, h:2000, a:80, g:55, s:0.9, d:55, l:'#192a56', b:'#f1c40f', t:'#f1c40f', u:0, z:68, bs:1 },
  { n:'家康', r:'R', c:90, h:2600, a:55, g:45, s:0.8, d:50, l:'#1e8449', b:'#f1c40f', t:'#f1c40f', u:0, z:64, bs:1 },
  { n:'秀吉', r:'R', c:95, h:1600, a:75, g:50, s:1.7, d:40, l:'#d4ac0d', b:'#fff', t:'#1e272e', u:0, z:64, bs:1 },
  { n:'メタル織田', r:'SR', c:70, h:700, a:65, g:195, s:1.2, d:45, l:'#95a5a6', b:'#00d2d3', t:'#1e272e', u:1, z:38, bs:0 },
  { n:'メタル豊臣', r:'SR', c:55, h:900, a:50, g:38, s:2.8, d:30, l:'#bdc3c7', b:'#f1c40f', t:'#1e272e', u:0, z:38, bs:0 },
  { n:'メタル家康', r:'SR', c:60, h:1500, a:32, g:35, s:1.1, d:38, l:'#7f8c8d', b:'#2ecc71', t:'#fff', u:0, z:38, bs:0 },
  { n:'魔王信長', r:'UR', c:140, h:3200, a:120, g:180, s:1.0, d:45, l:'#2c003e', b:'#ff3f34', t:'#ffdd59', u:1, z:72, bs:1 }
];

const S = [
  { t:'桶狭間の戦い', n:'今川本陣', h:1800, w:5200, b:'#576574', e1:'今川', e2:'弓兵', e3:'侍大将', eb:'義元', bh:1400, ba:55 },
  { t:'長篠の戦い', n:'武田城', h:3000, w:4500, b:'#87ceeb', e1:'武田', e2:'鉄砲', e3:'赤備', eb:'勝頼', bh:2200, ba:75 },
  { t:'関ヶ原の戦い', n:'西軍本陣', h:5000, w:3600, b:'#b2bec3', e1:'西軍', e2:'鉄砲', e3:'島津', eb:'三成', bh:3200, ba:95 }
];

let kb = 300;
let ow = '0,1,2,3'.split(',').map(Number);
let dk = '0,1,2,3'.split(',').map(Number);
let cr = 1, mn, ph, eh, ov, al, en, bl, tm, te, ts, ec, bt, bx, bc, aid;

function go(n) {
  document.querySelectorAll('.s').forEach(e => e.classList.remove('on'));
  $('s' + n).classList.add('on');
  $('k1').textContent = $('k4').textContent = kb;
  $('gb').disabled = kb < 100;
  if (n === 5) rnD();
}

function pl(n) { cr = n; go(3); ini(); }
function bn(t, l) { bx = t; bc = l; bt = 120; }

function pull() {
  if (kb < 100) return;
  kb -= 100;
  let r = Math.random() * 100;
  let p = r < 8 ? '9' : r < 28 ? '6,7,8' : r < 63 ? '3,4,5' : '0,1,2';
  let arr = p.split(',').map(Number);
  let u = arr[Math.floor(Math.random() * arr.length)];
  let nw = !ow.includes(u);
  if (nw) ow.push(u); else kb += 30;
  $('k1').textContent = $('k4').textContent = kb;
  $('gb').disabled = kb < 100;
  let x = A[u];
  let cl = x.r === 'UR' ? '#ff6b81' : x.r === 'SR' ? '#00d2d3' : '#f1c40f';
  $('grs').innerHTML = '<div style="color:' + cl + '">[' + x.r + '] ' + x.n + '</div><div style="font-size:12px;margin-top:6px">' + (nw ? 'NEW! 仲間になった！' : '所持済（小判+30返還）') + '</div>';
}

function rnD() {
  $('dk').textContent = '出陣枠:' + dk.map(i => A[i].n).join('/');
  $('pl').innerHTML = ow.map(i => {
    let u = A[i], on = dk.includes(i);
    let cl = u.r === 'UR' ? '#ff6b81' : u.r === 'SR' ? '#00d2d3' : '#f1c40f';
    return '<div class="cd ' + (on ? 'on' : '') + '" data-id="' + i + '"><b style="color:' + cl + '">[' + u.r + ']' + u.n + '</b><br>' + u.c + '両/HP' + u.h + '<br>' + (on ? '★編成中' : '選択') + '</div>';
  }).join('');
  document.querySelectorAll('.cd').forEach(el => {
    el.onclick = () => {
      let i = Number(el.dataset.id);
      if (dk.includes(i)) { if (dk.length > 1) dk = dk.filter(x => x !== i); }
      else if (dk.length < 4) dk.push(i);
      rnD();
    };
  });
}

function ini() {
  cancelAnimationFrame(aid);
  let s = S[cr];
  $('bt').textContent = s.t; $('en').textContent = s.n; $('cv').style.background = s.b;
  mn = 50; ph = 1000; eh = s.h; ov = 0; al = []; en = []; bl = [];
  tm = te = ts = Date.now(); ec = bt = 0;
  $('ed').style.display = 'none';
  for (let i = 0; i < 4; i++) {
    let b = $('b' + i), uid = dk[i], u = uid !== undefined ? A[uid] : null;
    if (u) {
      b.style.display = 'block'; b.innerHTML = u.n + '<br>' + u.c + '両';
      b.style.background = u.bs ? '#4a1c40' : '#273c75'; b.style.borderColor = u.b || '#f1c40f';
    } else b.style.display = 'none';
  }
  ae(); aid = requestAnimationFrame(lp);
}

function aa(i) {
  let uid = dk[i];
  if (uid === undefined) return;
  let u = A[uid];
  if (u && !ov && mn >= u.c) {
    mn -= u.c;
    if (u.bs) { bn('総大将・' + u.n + ' 出陣！', 'rgba(25,42,86,.9)'); en.forEach(e => e.k = 220); }
    al.push({ ...u, m: u.h, x: 590, o: 0, k: 0 });
  }
}

function sp() {
  let w = Date.now();
  if (ov || w - ts < 60000) return;
  ts = w; bn('必殺・鉄砲三段撃ち！！', 'rgba(194,54,22,.9)');
  for (let i = 0; i < 3; i++) setTimeout(() => { if (!ov) for (let r = 0; r < 5; r++) bl.push({ x: 620, y: 95 + r * 15, a: 45, f: 1, p: 1 }); }, i * 280);
}

function ae() {
  ec++;
  let s = S[cr], b = ec % 8 === 0, v = !b && ec % 4 === 0, g = !b && !v && ec % 3 === 0;
  if (b) { bn('敵将・' + s.eb + ' 出陣！', 'rgba(183,21,64,.85)'); al.forEach(a => a.k = 220); en.push({ n: s.eb, h: s.bh, m: s.bh, a: s.ba, g: 50, s: 0.9, d: 60, l: '#b71540', b: '#f1c40f', t: '#f1c40f', z: 68, x: 100, o: 0, k: 0 }); }
  else if (g) en.push({ n: s.e2, h: 140, m: 140, a: 32, g: 175, s: 1.1, d: 55, l: '#e67e22', t: '#fff', u: 1, z: 36, x: 90, o: 0, k: 0 });
  else en.push({ n: v ? s.e3 : s.e1, h: v ? 350 : 180, m: v ? 350 : 180, a: v ? 28 : 12, g: 35, s: v ? 2 : 1.1, d: v ? 55 : 48, l: v ? '#8e44ad' : '#c0392b', t: '#fff', z: 36, x: 90, o: 0, k: 0 });
}

function dr(u, f) {
  let s = u.z, h = s / 2, y = 166 - s;
  ctx.fillStyle = u.l; ctx.fillRect(u.x - h, y, s, s);
  ctx.lineWidth = s > 40 ? 3 : 1; ctx.strokeStyle = u.b || '#fff'; ctx.strokeRect(u.x - h, y, s, s);
  ctx.fillStyle = u.t; ctx.font = 'bold ' + (s > 40 ? 15 : 11) + 'px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(u.n, u.x, y + h + (s > 40 ? 5 : 4));
  ctx.fillStyle = '#333'; ctx.fillRect(u.x - h + 2, y - 8, s - 4, 5);
  ctx.fillStyle = f ? '#4cd137' : '#ff4757'; ctx.fillRect(u.x - h + 2, y - 8, (s - 4) * Math.max(0, u.h / u.m), 5);
}

function lp() {
  if (ov) return;
  let w = Date.now(), rm = Math.ceil((60000 - (w - ts)) / 1000);
  if (w - tm >= 1000) { mn = Math.min(1000, mn + 3); tm += 1000; }
  if (w - te >= S[cr].w) { ae(); te = w; }
  $('mn').textContent = mn; $('ph').textContent = Math.max(0, ph); $('eh').textContent = Math.max(0, eh);
  dk.forEach((u, i) => $('b' + i).disabled = mn < A[u].c);
  $('bp').disabled = rm > 0;
  $('bp').innerHTML = rm > 0 ? '三段撃ち<br>(' + rm + 's)' : '三段撃ち<br>発動！';

  ctx.clearRect(0, 0, 700, 220);
  ctx.fillStyle = '#558b2f'; ctx.fillRect(0, 168, 700, 52);
  ctx.fillStyle = '#c23616'; ctx.fillRect(20, 88, 55, 80);
  ctx.fillStyle = '#273c75'; ctx.fillRect(625, 88, 55, 80);
  if (bt > 0) { bt--; ctx.fillStyle = bc; ctx.fillRect(180, 14, 340, 32); ctx.strokeStyle = '#f1c40f'; ctx.strokeRect(180, 14, 340, 32); ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(bx, 350, 36); }

  al.forEach(a => {
    if (a.k > 0) { let s = Math.min(18, a.k); a.x = Math.min(600, a.x + s); a.k -= s; }
    else {
      if (a.o > 0) a.o--;
      let t = en.find(e => a.x >= e.x - 45 && a.x - (e.x + e.z / 2) <= a.g);
      if (t) { if (!a.o) { a.u ? bl.push({ x: a.x - 15, y: 148, a: a.a, f: 1 }) : t.h -= a.a; a.o = a.d; } }
      else if (a.x - 75 <= a.g) { if (!a.o) { a.u ? bl.push({ x: a.x - 15, y: 148, a: a.a, f: 1 }) : eh -= a.a; a.o = a.d; } }
      else a.x -= a.s;
    }
    dr(a, 1);
  });

  en.forEach(e => {
    if (e.k > 0) { let s = Math.min(18, e.k); e.x = Math.max(100, e.x - s); e.k -= s; }
    else {
      if (e.o > 0) e.o--;
      let x = e.x + e.z / 2, t = al.find(a => (a.x - a.z / 2) >= e.x - 45 && (a.x - a.z / 2) - x <= e.g);
      if (t) { if (!e.o) { e.u ? bl.push({ x: e.x + 15, y: 148, a: e.a, f: 0 }) : t.h -= e.a; e.o = e.d; } }
      else if (625 - x <= e.g) { if (!e.o) { e.u ? bl.push({ x: e.x + 15, y: 148, a: e.a, f: 0 }) : ph -= e.a; e.o = e.d; } }
      else e.x += e.s;
    }
    dr(e, 0);
  });

  for (let k = bl.length - 1; k >= 0; k--) {
    let b = bl[k]; b.x += b.f ? (b.p ? -15 : -10) : 10;
    ctx.fillStyle = b.p ? '#ff3f34' : (b.f ? '#ffd32a' : '#ff9f43');
    ctx.beginPath(); ctx.arc(b.x, b.y, b.p ? 5 : 4, 0, 6.283); ctx.fill();
    let h = b.f ? en.find(e => e.h > 0 && Math.abs(b.x - e.x) <= e.z / 2) : al.find(a => a.h > 0 && Math.abs(b.x - a.x) <= a.z / 2);
    if (h) { h.h -= b.a; bl.splice(k, 1); }
    else if (b.f && b.x <= 75) { eh -= b.a; bl.splice(k, 1); }
    else if (!b.f && b.x >= 625) { ph -= b.a; bl.splice(k, 1); }
    else if (b.x < 0 || b.x > 700) bl.splice(k, 1);
  }

  al = al.filter(a => a.h > 0);
  mn = Math.min(1000, mn + en.filter(e => e.h <= 0).length * 5);
  en = en.filter(e => e.h > 0);

  if (eh <= 0 || ph <= 0) {
    ov = 1; $('eh').textContent = Math.max(0, eh); $('ph').textContent = Math.max(0, ph);
    if (eh <= 0) kb += 150;
    ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(0, 0, 700, 220);
    ctx.fillStyle = eh <= 0 ? '#f1c40f' : '#ff6b81'; ctx.font = 'bold 28px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(eh <= 0 ? '勝利！小判150両獲得！' : '連合軍の敗北…', 350, 120);
    $('ed').style.display = 'flex'; return;
  }
  aid = requestAnimationFrame(lp);
}

$('btn-start').onclick = () => go(1);
$('btn-map').onclick = () => go(2);
$('btn-gacha').onclick = () => go(4);
$('btn-deck').onclick = () => go(5);
$('btn-title').onclick = () => go(0);
$('btn-home1').onclick = $('btn-home2').onclick = $('btn-home3').onclick = () => go(1);
$('st0').onclick = () => pl(0);
$('st1').onclick = () => pl(1);
$('st2').onclick = () => pl(2);
$('btn-quit').onclick = () => { ov = 1; go(2); };
$('btn-retry').onclick = () => ini();
$('btn-tomap').onclick = () => go(2);
$('gb').onclick = () => pull();
$('b0').onclick = () => aa(0);
$('b1').onclick = () => aa(1);
$('b2').onclick = () => aa(2);
$('b3').onclick = () => aa(3);
$('bp').onclick = () => sp();
</script>
</body>
</html>
