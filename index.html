<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>戦国大戦争</title>
<style>
  body { margin:0; background:#1e272e; color:#fff; font-family:sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; }
  #game { width:720px; max-width:96vw; background:#2f3640; border:2px solid #f1c40f; border-radius:10px; padding:16px; box-sizing:border-box; text-align:center; }
  .scr { display:none; height:360px; flex-direction:column; justify-content:center; align-items:center; position:relative; border-radius:8px; }
  .scr.on { display:flex; }
  #s-title { background:radial-gradient(circle,#353b48,#1e272e); }
  #s-home { background:linear-gradient(135deg,#2c3e50,#1e272e); }
  #s-map { background:#3d5a3c radial-gradient(#4a6b48 2px,transparent 2px) 0 0/24px 24px; border:2px solid #78e08f; }
  #s-bat { height:auto; }
  .logo { font-size:44px; font-weight:bold; color:#f1c40f; text-shadow:3px 3px 0 #c23616; margin:-60px 0 36px; letter-spacing:4px; }
  .tag { position:absolute; top:12px; left:16px; font-size:16px; font-weight:bold; color:#f1c40f; }
  .m-btn { padding:14px 36px; font-size:20px; font-weight:bold; color:#fff; background:#c23616; border:3px solid #f1c40f; border-radius:8px; cursor:pointer; }
  .m-btn:hover { background:#e84118; }
  .b-btn { position:absolute; bottom:12px; left:12px; padding:6px 14px; font-size:13px; background:#57606f; color:#fff; border:1px solid #a4b0be; border-radius:4px; cursor:pointer; }
  .bar { width:100%; box-sizing:border-box; display:flex; justify-content:space-between; background:#1e272e; padding:8px 16px; border-radius:6px; font-weight:bold; font-size:15px; margin-bottom:8px; }
  canvas { background:#87ceeb; border:2px solid #fff; border-radius:6px; display:block; width:100%; height:220px; }
  .btns { width:100%; display:flex; gap:8px; margin-top:12px; }
  .u-btn { flex:1; padding:12px 4px; font-size:14px; font-weight:bold; color:#fff; background:#273c75; border:2px solid #f1c40f; border-radius:8px; cursor:pointer; }
  .u-btn:disabled { background:#57606f; border-color:#7f8fa6; color:#a4b0be; cursor:not-allowed; }
  #end { display:none; gap:12px; margin-top:12px; }
</style>
</head>
<body>
<div id="game">
  <div id="s-title" class="scr on">
    <div class="logo">戦国大戦争</div>
    <button class="m-btn" onclick="go('home')">出陣</button>
  </div>
  <div id="s-home" class="scr">
    <div class="tag">本陣（ホーム）</div>
    <button class="m-btn" style="position:absolute;top:32%;left:34%;transform:translate(-50%,-50%)" onclick="go('map')">出陣</button>
    <button class="b-btn" onclick="go('title')">タイトルへ</button>
  </div>
  <div id="s-map" class="scr">
    <div class="tag" style="background:rgba(0,0,0,.6);padding:4px 12px;border-radius:4px">合戦場を選択</div>
    <button class="m-btn" style="border-radius:50px" onclick="go('bat');init()">⚔️ 長篠</button>
    <button class="b-btn" onclick="go('home')">ホームへ戻る</button>
  </div>
  <div id="s-bat" class="scr">
    <div style="width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <b style="font-size:18px;color:#f1c40f">長篠の戦い</b>
      <button onclick="over=1;go('map')" style="padding:4px 10px;font-size:12px;background:#57606f;color:#fff;border:1px solid #a4b0be;border-radius:4px;cursor:pointer">撤退（マップへ）</button>
    </div>
    <div class="bar">
      <span style="color:#ff6b81">武田城: <span id="eHp">3000</span></span>
      <span style="color:#f1c40f">軍資金: <span id="mon">50</span>両</span>
      <span style="color:#70a1ff">連合城: <span id="pHp">1000</span></span>
    </div>
    <canvas id="cv" width="700" height="220"></canvas>
    <div class="btns">
      <button class="u-btn" id="b0" onclick="addA(0)">徳川 15両</button>
      <button class="u-btn" id="b1" onclick="addA(1)">豊臣 30両</button>
      <button class="u-btn" id="b2" onclick="addA(2)">織田 50両</button>
      <button class="u-btn" id="b3" onclick="addA(3)" style="background:#4a1c40;border-color:#ff9ff3">信長 100両</button>
      <button class="u-btn" id="bSp" onclick="sp()" style="background:#c23616;border-color:#ffd32a" disabled>三段撃ち(60s)</button>
    </div>
    <div id="end">
      <button class="m-btn" style="padding:10px 24px;font-size:16px" onclick="init()">再戦</button>
      <button class="m-btn" style="padding:10px 24px;font-size:16px;background:#273c75" onclick="go('map')">マップへ戻る</button>
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id), ctx=$('cv').getContext('2d');
const AT=[
  {n:'徳川',c:15,hp:300,atk:16,rng:30,spd:1,cd:40,col:'#27ae60',tc:'#fff',sz:36},
  {n:'豊臣',c:30,hp:160,atk:34,rng:35,spd:2.5,cd:35,col:'#f1c40f',tc:'#1e272e',sz:36},
  {n:'織田',c:50,hp:100,atk:48,rng:185,spd:1.1,cd:50,col:'#8e44ad',tc:'#fff',gun:1,sz:36},
  {n:'信長',c:100,hp:2000,atk:80,rng:55,spd:.9,cd:55,col:'#192a56',bc:'#f1c40f',tc:'#f1c40f',sz:68}
];
let mon,pHp,eHp,over,al,en,bl,tM,tE,tS,eC,bT,bTx,bCl,aid;

const go=s=>{document.querySelectorAll('.scr').forEach(e=>e.classList.remove('on'));$('s-'+s).classList.add('on');};
const ban=(t,c)=>{bTx=t;bCl=c;bT=120;};

function init(){
  cancelAnimationFrame(aid);
  mon=50;pHp=1000;eHp=3000;over=0;al=[];en=[];bl=[];tM=tE=tS=Date.now();eC=bT=0;
  $('end').style.display='none'; addE(); aid=requestAnimationFrame(loop);
}
function addA(i){
  let u=AT[i];
  if(!over&&mon>=u.c){
    mon-=u.c;
    if(i===3){ban('総大将・織田信長 出陣！','rgba(25,42,86,.9)');en.forEach(e=>e.kb=220);}
    al.push({...u,max:u.hp,x:590,tm:0,kb:0});
  }
}
function sp(){
  let now=Date.now();
  if(over||now-tS<60000)return;
  tS=now; ban('必殺・鉄砲三段撃ち！！','rgba(194,54,22,.9)');
  for(let w=0;w<3;w++)setTimeout(()=>{if(!over)for(let r=0;r<5;r++)bl.push({x:620,y:95+r*15,atk:45,a:1,sp:1});},w*280);
}
function addE(){
  eC++;
  let b=eC%8===0,c=!b&&eC%4===0,g=!b&&!c&&eC%3===0;
  if(b){ban('敵将・武田勝頼 出陣！','rgba(183,21,64,.85)');al.forEach(a=>a.kb=220);en.push({n:'勝頼',hp:2200,max:2200,atk:75,rng:50,spd:.9,cd:60,col:'#b71540',bc:'#f1c40f',tc:'#f1c40f',sz:68,x:100,tm:0,kb:0});}
  else if(g)en.push({n:'鉄砲',hp:140,max:140,atk:32,rng:175,spd:1.1,cd:55,col:'#e67e22',tc:'#fff',gun:1,sz:36,x:90,tm:0,kb:0});
  else en.push({n:c?'赤備':'武田',hp:c?350:180,max:c?350:180,atk:c?28:12,rng:35,spd:c?2:1.1,cd:c?55:48,col:c?'#8e44ad':'#c0392b',tc:'#fff',sz:36,x:90,tm:0,kb:0});
}
function draw(u,isA){
  let s=u.sz,h=s/2,ty=166-s;
  ctx.fillStyle=u.col;ctx.fillRect(u.x-h,ty,s,s);
  ctx.lineWidth=s>40?3:1;ctx.strokeStyle=u.bc||'#fff';ctx.strokeRect(u.x-h,ty,s,s);
  ctx.fillStyle=u.tc;ctx.font=`bold ${s>40?18:12}px sans-serif`;ctx.textAlign='center';
  ctx.fillText(u.n,u.x,ty+h+(s>40?6:4));
  ctx.fillStyle='#333';ctx.fillRect(u.x-h+2,ty-8,s-4,5);
  ctx.fillStyle=isA?'#4cd137':'#ff4757';ctx.fillRect(u.x-h+2,ty-8,(s-4)*Math.max(0,u.hp/u.max),5);
}
function loop(){
  if(over)return;
  let now=Date.now(),rem=Math.ceil((60000-(now-tS))/1000);
  if(now-tM>=1000){mon=Math.min(1000,mon+3);tM+=1000;}
  if(now-tE>=4500){addE();tE=now;}
  $('mon').textContent=mon;$('pHp').textContent=Math.max(0,pHp);$('eHp').textContent=Math.max(0,eHp);
  AT.forEach((u,i)=>$('b'+i).disabled=mon<u.c);
  $('bSp').disabled=rem>0;$('bSp').textContent=rem>0?`三段撃ち(${rem}s)`:'三段撃ち 発動！';

  ctx.clearRect(0,0,700,220);
  ctx.fillStyle='#558b2f';ctx.fillRect(0,168,700,52);
  ctx.fillStyle='#c23616';ctx.fillRect(20,88,55,80);
  ctx.fillStyle='#273c75';ctx.fillRect(625,88,55,80);
  if(bT>0){bT--;ctx.fillStyle=bCl;ctx.fillRect(180,14,340,32);ctx.strokeStyle='#f1c40f';ctx.strokeRect(180,14,340,32);ctx.fillStyle='#f1c40f';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillText(bTx,350,36);}

  al.forEach(a=>{
    if(a.kb>0){let s=Math.min(18,a.kb);a.x=Math.min(600,a.x+s);a.kb-=s;}
    else{
      if(a.tm>0)a.tm--;
      let t=en.find(e=>a.x>=e.x-45&&a.x-(e.x+e.sz/2)<=a.rng);
      if(t){if(!a.tm){a.gun?bl.push({x:a.x-15,y:148,atk:a.atk,a:1}):t.hp-=a.atk;a.tm=a.cd;}}
      else if(a.x-75<=a.rng){if(!a.tm){a.gun?bl.push({x:a.x-15,y:148,atk:a.atk,a:1}):eHp-=a.atk;a.tm=a.cd;}}
      else a.x-=a.spd;
    }
    draw(a,1);
  });
  en.forEach(e=>{
    if(e.kb>0){let s=Math.min(18,e.kb);e.x=Math.max(100,e.x-s);e.kb-=s;}
    else{
      if(e.tm>0)e.tm--;
      let fx=e.x+e.sz/2,t=al.find(a=>(a.x-a.sz/2)>=e.x-45&&(a.x-a.sz/2)-fx<=e.rng);
      if(t){if(!e.tm){e.gun?bl.push({x:e.x+15,y:148,atk:e.atk,a:0}):t.hp-=e.atk;e.tm=e.cd;}}
      else if(625-fx<=e.rng){if(!e.tm){e.gun?bl.push({x:e.x+15,y:148,atk:e.atk,a:0}):pHp-=e.atk;e.tm=e.cd;}}
      else e.x+=e.spd;
    }
    draw(e,0);
  });
  for(let k=bl.length-1;k>=0;k--){
    let b=bl[k];b.x+=b.a?(b.sp?-15:-10):10;
    ctx.fillStyle=b.sp?'#ff3f34':(b.a?'#ffd32a':'#ff9f43');
    ctx.beginPath();ctx.arc(b.x,b.y,b.sp?5:4,0,Math.PI*2);ctx.fill();
    let hit=b.a?en.find(e=>e.hp>0&&Math.abs(b.x-e.x)<=e.sz/2):al.find(a=>a.hp>0&&Math.abs(b.x-a.x)<=a.sz/2);
    if(hit){hit.hp-=b.atk;bl.splice(k,1);}
    else if(b.a&&b.x<=75){eHp-=b.atk;bl.splice(k,1);}
    else if(!b.a&&b.x>=625){pHp-=b.atk;bl.splice(k,1);}
    else if(b.x<0||b.x>700)bl.splice(k,1);
  }
  al=al.filter(a=>a.hp>0);
  mon=Math.min(1000,mon+en.filter(e=>e.hp<=0).length*5);
  en=en.filter(e=>e.hp>0);

  if(eHp<=0||pHp<=0){
    over=1;$('eHp').textContent=Math.max(0,eHp);$('pHp').textContent=Math.max(0,pHp);
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,700,220);ctx.fillStyle=eHp<=0?'#f1c40f':'#ff6b81';
    ctx.font='bold 32px sans-serif';ctx.textAlign='center';ctx.fillText(eHp<=0?'連合軍の勝利！':'武田軍に敗北…',350,120);
    $('end').style.display='flex';return;
  }
  aid=requestAnimationFrame(loop);
}
</script>
</body>
</html>
