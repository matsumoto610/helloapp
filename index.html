<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>長篠の戦い</title>
  <style>
    * {
      touch-action: manipulation;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 10px;
      background-color: #1e272e;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 18px;
      margin: 5px 0 10px 0;
      color: #ffd32a;
    }

    #hud {
      width: 100%;
      max-width: 700px;
      display: flex;
      justify-content: space-between;
      background: #2f3640;
      padding: 10px;
      border-radius: 8px 8px 0 0;
      font-weight: bold;
      font-size: 14px;
    }

    #moneyDisplay {
      color: #ffd32a;
    }

    canvas {
      background-color: #87CEEB;
      width: 100%;
      max-width: 700px;
      height: 250px;
      display: block;
      border-left: 3px solid #2f3640;
      border-right: 3px solid #2f3640;
    }

    #controls {
      width: 100%;
      max-width: 700px;
      display: flex;
      gap: 8px;
      background: #2f3640;
      padding: 10px;
      border-radius: 0 0 8px 8px;
    }

    .unit-btn {
      flex: 1;
      padding: 12px 4px;
      border: 2px solid #ffd32a;
      border-radius: 8px;
      background-color: #40739e;
      color: white;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    .unit-btn:disabled {
      opacity: 0.4;
      border-color: #7f8fa6;
      background-color: #353b48;
    }

    #restartBtn {
      display: none;
      margin-top: 15px;
      padding: 12px 30px;
      font-size: 16px;
      font-weight: bold;
      background-color: #e84118;
      color: white;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h1>長篠の戦い 〜織田・豊臣・徳川〜</h1>

  <div id="hud">
    <div>連合城: <span id="playerHp">1000</span></div>
    <div id="moneyDisplay">軍資金: <span id="money">500</span>両</div>
    <div>武田城: <span id="enemyHp">1500</span></div>
  </div>

  <canvas id="gameCanvas" width="700" height="250"></canvas>

  <div id="controls">
    <button type="button" class="unit-btn" id="btnTokugawa">徳川（守り）<br>15両</button>
    <button type="button" class="unit-btn" id="btnToyotomi">豊臣（突撃）<br>30両</button>
    <button type="button" class="unit-btn" id="btnOda">織田（鉄砲）<br>50両</button>
  </div>

  <button type="button" id="restartBtn">もう一度戦う！</button>

  <script>
    // もしプログラムにエラーが起きたら画面にアラートを出す
    window.onerror = function(msg, url, line) {
      alert("エラーが発生しました: " + msg + " (" + line + "行目)");
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let money = 500;
    const maxMoney = 1000;
    let playerCastleHp = 1000;
    let enemyCastleHp = 1500;
    let gameOver = false;
    let lastMoneyTime = Date.now();
    let lastEnemyTime = Date.now();
    let enemySpawnCount = 0;

    let allies = [];
    let enemies = [];
    let bullets = [];

    const ALLY_TYPES = {
      tokugawa: { label: '徳川', color: '#2ecc71', cost: 15, hp: 320, atk: 12, range: 35, speed: 0.9, atkSpeed: 50 },
      toyotomi: { label: '豊臣', color: '#f1c40f', cost: 30, hp: 160, atk: 30, range: 40, speed: 1.8, atkSpeed: 35 },
      oda:      { label: '織田', color: '#3498db', cost: 50, hp: 90,  atk: 65, range: 190, speed: 1.0, atkSpeed: 65 }
    };

    const ENEMY_TYPES = {
      foot:    { label: '武田', color: '#e74c3c', hp: 120, atk: 16, range: 35, speed: 1.2, atkSpeed: 45 },
      cavalry: { label: '赤備', color: '#8e44ad', hp: 250, atk: 42, range: 40, speed: 2.5, atkSpeed: 50 }
    };

    function spawnPlayer(typeKey) {
      if (gameOver) return;
      const spec = ALLY_TYPES[typeKey];
      if (money >= spec.cost) {
        money -= spec.cost;
        allies.push({
          label: spec.label,
          color: spec.color,
          hp: spec.hp,
          maxHp: spec.hp,
          atk: spec.atk,
          range: spec.range,
          speed: spec.speed,
          atkSpeed: spec.atkSpeed,
          x: 600,
          y: 170,
          cooldown: 0
        });
      }
    }

    function spawnEnemy(typeKey) {
      const spec = ENEMY_TYPES[typeKey];
      enemies.push({
        label: spec.label,
        color: spec.color,
        hp: spec.hp,
        maxHp: spec.hp,
        atk: spec.atk,
        range: spec.range,
        speed: spec.speed,
        atkSpeed: spec.atkSpeed,
        x: 90,
        y: 170,
        cooldown: 0
      });
    }

    document.getElementById('btnTokugawa').onclick = function() { spawnPlayer('tokugawa'); };
    document.getElementById('btnToyotomi').onclick = function() { spawnPlayer('toyotomi'); };
    document.getElementById('btnOda').onclick = function() { spawnPlayer('oda'); };
    document.getElementById('restartBtn').onclick = function() { resetGame(); };

    function resetGame() {
      money = 500;
      playerCastleHp = 1000;
      enemyCastleHp = 1500;
      allies = [];
      enemies = [];
      bullets = [];
      gameOver = false;
      lastMoneyTime = Date.now();
      lastEnemyTime = Date.now();
      enemySpawnCount = 0;
      document.getElementById('restartBtn').style.display = 'none';

      spawnEnemy('foot');
      requestAnimationFrame(loop);
    }

    function drawBackgroundAndCastles() {
      // 地面（緑）
      ctx.fillStyle = '#558b2f';
      ctx.fillRect(0, 195, 700, 55);

      // 武田城（左）
      ctx.fillStyle = '#c23616';
      ctx.fillRect(20, 105, 60, 90);
      ctx.fillStyle = 'white';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('武田陣', 50, 95);

      // 連合城（右）
      ctx.fillStyle = '#273c75';
      ctx.fillRect(620, 105, 60, 90);
      ctx.fillStyle = 'white';
      ctx.fillText('連合陣', 650, 95);
    }

    function drawUnit(u, isAlly) {
      // キャラ本体（色付きの四角＋漢字ラベル）
      ctx.fillStyle = u.color;
      ctx.fillRect(u.x - 16, u.y - 15, 32, 38);
      ctx.strokeStyle = 'white';
      ctx.lineWidth = 2;
      ctx.strokeRect(u.x - 16, u.y - 15, 32, 38);

      // 武将名
      ctx.fillStyle = 'white';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(u.label, u.x, u.y + 8);

      // HPバー
      const barWidth = 34;
      const hpRatio = Math.max(0, u.hp / u.maxHp);
      ctx.fillStyle = '#333';
      ctx.fillRect(u.x - barWidth / 2, u.y - 25, barWidth, 5);
      ctx.fillStyle = isAlly ? '#4cd137' : '#ff4757';
      ctx.fillRect(u.x - barWidth / 2, u.y - 25, barWidth * hpRatio, 5);
    }

    function loop() {
      if (gameOver) return;
      const now = Date.now();

      // 1秒につき3両増える
      if (now - lastMoneyTime >= 1000) {
        if (money < maxMoney) {
          money = Math.min(maxMoney, money + 3);
        }
        lastMoneyTime += 1000;
      }

      // 4秒ごとに敵が出現
      if (now - lastEnemyTime >= 4000) {
        enemySpawnCount++;
        if (enemySpawnCount % 3 === 0) {
          spawnEnemy('cavalry');
        } else {
          spawnEnemy('foot');
        }
        lastEnemyTime = now;
      }

      document.getElementById('money').textContent = money;
      document.getElementById('playerHp').textContent = Math.max(0, playerCastleHp);
      document.getElementById('enemyHp').textContent = Math.max(0, enemyCastleHp);

      document.getElementById('btnTokugawa').disabled = money < 15;
      document.getElementById('btnToyotomi').disabled = money < 30;
      document.getElementById('btnOda').disabled = money < 50;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBackgroundAndCastles();

      // 味方の行動
      for (let i = allies.length - 1; i >= 0; i--) {
        const a = allies[i];
        if (a.cooldown > 0) a.cooldown--;

        let target = enemies.find(e => Math.abs(a.x - e.x) <= a.range && a.x >= e.x);
        let hitCastle = (a.x - 80) <= a.range;

        if (target) {
          if (a.cooldown === 0) {
            if (a.label === '織田') {
              bullets.push({ x: a.x - 15, y: a.y, target: target, atk: a.atk });
            } else {
              target.hp -= a.atk;
            }
            a.cooldown = a.atkSpeed;
          }
        } else if (hitCastle) {
          if (a.cooldown === 0) {
            enemyCastleHp -= a.atk;
            a.cooldown = a.atkSpeed;
          }
        } else {
          a.x -= a.speed;
        }

        drawUnit(a, true);
      }

      // 敵の行動
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (e.cooldown > 0) e.cooldown--;

        let target = allies.find(a => Math.abs(a.x - e.x) <= e.range && a.x >= e.x);
        let hitCastle = (620 - e.x) <= e.range;

        if (target) {
          if (e.cooldown === 0) {
            target.hp -= e.atk;
            e.cooldown = e.atkSpeed;
          }
        } else if (hitCastle) {
          if (e.cooldown === 0) {
            playerCastleHp -= e.atk;
            e.cooldown = e.atkSpeed;
          }
        } else {
          e.x += e.speed;
        }

        drawUnit(e, false);
      }

      // 弾丸の描画
      ctx.fillStyle = '#ffd32a';
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x -= 10;
        ctx.beginPath();
        ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
        ctx.fill();

        if (b.target && b.x <= b.target.x) {
          b.target.hp -= b.atk;
          bullets.splice(i, 1);
        } else if (b.x < 0) {
          bullets.splice(i, 1);
        }
      }

      allies = allies.filter(a => a.hp > 0);
      enemies = enemies.filter(e => e.hp > 0);

      if (enemyCastleHp <= 0 || playerCastleHp <= 0) {
        gameOver = true;
        const winner = enemyCastleHp <= 0 ? '連合軍の勝利！' : '武田軍に敗北…';
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffd32a';
        ctx.font = 'bold 30px sans-serif';
