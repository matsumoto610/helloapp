<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>関ヶ原にゃんこ大戦争</title>
<style>
  body { margin: 0; background: #1e272e; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  #app { width: 720px; background: #2f3640; border: 3px solid #dcdde1; border-radius: 10px; padding: 15px; box-sizing: border-box; text-align: center; }
  .screen { display: none; }
  .active { display: block; }
  h1, h2 { margin: 8px 0; color: #fbc531; }
  .header { display: flex; justify-content: space-between; align-items: center; background: #1e272e; padding: 8px 15px; border-radius: 6px; margin-bottom: 12px; font-weight: bold; }
  button { cursor: pointer; border: none; border-radius: 6px; padding: 10px 16px; font-size: 14px; font-weight: bold; background: #e1b12c; color: #1e272e; }
  button:hover:not(:disabled) { background: #fbc531; }
  button:disabled { background: #7f8fa6; color: #dcdde1; cursor: not-allowed; }
  .stage-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .stage-btn { background: #40739e; color: #fff; padding: 12px; font-size: 16px; }
  .stage-btn:hover:not(:disabled) { background: #487eb0; }
  #gachaResult { margin: 15px auto; padding: 15px; background: #1e272e; border-radius: 8px; min-height: 55px; line-height: 1.6; }
  #teamSlots { display: flex; justify-content: center; gap: 10px; margin: 12px 0; }
  .slot { width: 140px; height: 65px; background: #1e272e; border: 2px dashed #fbc531; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 13px; }
  #charList { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
  .cCard { background: #353b48; color: #fff; border: 2px solid #718093; padding: 8px; font-size: 12px; }
  .cCard.selected { border-color: #4cd137; background: #218c74; }
  .battle-info { display: flex; justify-content: space-between; font-size: 15px; font-weight: bold; margin-bottom: 6px; }
  canvas { background: #87ceeb; border: 2px solid #fff; border-radius: 6px; display: block; margin: 0 auto; }
  .unit-bar { display: flex; justify-content: center; gap: 12px; margin-top: 10px; min-height: 54px; }
  .unit-btn { width: 120px; height: 52px; background: #44bd32; color: #fff; font-size: 14px; }
  .unit-btn:hover:not(:disabled) { background: #4cd137; }
  #backMap { margin: 10px auto 0; background: #e84118; color: #fff; display: none; }
</style>
</head>
<body>

<div id="app">
  <div id="map" class="screen active">
    <h1>⚔️ 関ヶ原にゃんこ大戦争 ⚔️</h1>
    <div class="header">
      <span>勝利数：<span id="winCount">0</span>勝</span>
      <div>
        <button onclick="openTeam()">武将編成</button>
        <button onclick="openGacha()">武将ガチャ</button>
      </div>
    </div>
    <p>出陣する合戦場を選べ！</p>
    <div class="stage-list" id="stageList"></div>
  </div>

  <div id="gacha" class="screen">
    <h2>🏮 武将登用ガチャ 🏮</h2>
    <div class="header">
      <span>所持勝利数：<span id="gachaWinCount">0</span>勝</span>
      <span>必要勝利数：<span id="gachaCost">1</span>勝</span>
    </div>
    <button id="gachaBtn" onclick="drawGacha()">ガチャを引く</button>
    <div id="gachaResult">勝利数を消費して新たな武将を登用しよう！</div>
    <button onclick="go('map')">マップへ戻る</button>
  </div>

  <div id="team" class="screen">
    <h2>🛡️ 出陣編成（最大3体） 🛡️</h2>
    <div id="teamSlots"></div>
    <p style="font-size:13px; color:#dcdde1;">所持武将をクリックして入れ替え</p>
    <div id="charList"></div>
    <button onclick="go('map')">マップへ戻る</button>
  </div>

  <div id="battle" class="screen">
    <div class="battle-info">
      <span style="color:#ff6b81;">西軍城HP: <span id="eHp">1000</span></span>
      <span id="stName" style="color:#fbc531;">ステージ名</span>
      <span style="color:#70a1ff;">東軍城HP: <span id="pHp">1000</span></span>
    </div>
    <div style="text-align:right; font-weight:bold; margin-bottom:5px; color:#fbc531;">
      軍資金：<span id="mny">100</span> / 1000 両
    </div>
    <canvas id="cv" width="700" height="220"></canvas>
    <div class="unit-bar">
      <button id="b0" class="unit-btn" onclick="unit(0)"></button>
      <button id="b1" class="unit-btn" onclick="unit(1)"></button>
      <button id="b2" class="unit-btn" onclick="unit(2)"></button>
    </div>
    <button id="backMap" onclick="go('map')">マップへ戻る</button>
  </div>
</div>

<script>
const ALL_CHARS = [
  { rare: 'N',   n: '足軽', full: '東軍 足軽隊',     cost: 30,  hp: 100, atk: 15,  r: 30,  sp: 1.5, cd: 40, c: '#3498db', gun: false },
  { rare: 'N',   n: '鉄砲', full: '堺 鉄砲隊',       cost: 60,  hp: 70,  atk: 25,  r: 160, sp: 1.1, cd: 65, c: '#e67e22', gun: true  },
  { rare: 'R',   n: '槍兵', full: '長柄 槍衾隊',     cost: 80,  hp: 220, atk: 20,  r: 45,  sp: 1.2, cd: 45, c: '#1abc9c', gun: false },
  { rare: 'R',   n: '騎馬', full: '赤備え 騎馬隊',   cost: 120, hp: 160, atk: 45,  r: 35,  sp: 2.8, cd: 35, c: '#e74c3c', gun: false },
  { rare: 'SR',  n: '黒田', full: '黒田長政',        cost: 180, hp: 320, atk: 60,  r: 50,  sp: 1.6, cd: 40, c: '#9b59b6', gun: false },
  { rare: 'SR',  n: '福島', full: '福島正則',        cost: 220, hp: 450, atk: 75,  r: 45,  sp: 1.4, cd: 45, c: '#2ecc71', gun: false },
  { rare: 'SSR', n: '忠勝', full: '本多忠勝',        cost: 320, hp: 750, atk: 120, r: 55,  sp: 1.7, cd: 38, c: '#f1c40f', gun: false },
  { rare: 'UR',  n: '家康', full: '徳川家康（大筒）', cost: 450, hp: 600, atk: 180, r: 220, sp: 0.9, cd: 75, c: '#ff4757', gun: true  }
];

const STS = [
  { n: '第1戦：杭瀬川の戦い',     hp: 600,  ms: 3500, e1: '西軍足軽', e2: '島左近' },
  { n: '第2戦：松尾山の睨み合い', hp: 1000, ms: 3000, e1: '宇喜多兵', e2: '小早川隊' },
  { n: '第3戦：笹尾山・決戦',     hp: 1600, ms: 2600, e1: '石田親衛', e2: '大谷吉継' },
  { n: '最終決戦：関ヶ原の戦い',  hp: 2500, ms: 2200, e1: '島津鉄砲', e2: '石田三成' }
];

let wins = 1;
let gachaCount = 1;
let ownedIds = new Array(0, 1);
let teamIds = new Array(0, 1);

let st = 0, mny = 100, pHp = 1000, eHp = 1000, over = false;
let al = [], en = [], bl = [], cnt = 0, tM = 0, tE = 0;
const ctx = document.getElementById('cv').getContext('2d');

function go(id) {
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  updateWinUI();
}

function updateWinUI() {
  document.getElementById('winCount').textContent = wins;
  document.getElementById('gachaWinCount').textContent = wins;
  document.getElementById('gachaCost').textContent = gachaCount;
  document.getElementById('gachaBtn').disabled = wins < gachaCount;
}

function initStages() {
  const list = document.getElementById('stageList');
  list.innerHTML = STS.map((s, idx) =>
    `<button class="stage-btn" onclick="play(${idx})">${s.n}（敵城HP: ${s.hp}）</button>`
  ).join('');
}

function openGacha() {
  go('gacha');
  document.getElementById('gachaResult').textContent = '勝利数を消費して新たな武将を登用しよう！';
}

function drawGacha() {
  if (wins < gachaCount) return;
  wins -= gachaCount;
  updateWinUI();

  const r = Math.random();
  let pool = ALL_CHARS;
  if (r < 0.08) pool = ALL_CHARS.filter(c => c.rare === 'UR');
  else if (r < 0.25) pool = ALL_CHARS.filter(c => c.rare === 'SSR');
  else if (r < 0.55) pool = ALL_CHARS.filter(c => c.rare === 'SR');
  else pool = ALL_CHARS.filter(c => c.rare === 'R' || c.rare === 'N');

  const picked = pool[Math.floor(Math.random() * pool.length)];
  const pickedId = ALL_CHARS.indexOf(picked);
  const isNew = !ownedIds.includes(pickedId);
  if (isNew) {
    ownedIds.push(pickedId);
    if (teamIds.length < 3) teamIds.push(pickedId);
  }

  document.getElementById('gachaResult').innerHTML = `
    【${picked.rare}】<span style="font-size:20px; color:#fff;">${picked.full}</span> を獲得！<br>
    <span style="font-size:12px; color:#4cd137;">${isNew ? '★NEW！チーム編成で使えます' : '（すでに所持しています）'}</span>
  `;
  document.getElementById('gachaBtn').disabled = wins < gachaCount;
}

function openTeam() {
  go('team');
  renderTeam();
}

function renderTeam() {
  const slotsEl = document.getElementById('teamSlots');
  const slots = new Array(0, 1, 2);
  slotsEl.innerHTML = slots.map(idx => {
    const ch = ALL_CHARS[teamIds[idx]];
    return `<div class="slot">${ch ? `${ch.full}<br>${ch.cost}両` : '空き枠'}</div>`;
  }).join('');

  const listEl = document.getElementById('charList');
  listEl.innerHTML = ownedIds.map(id => {
    const ch = ALL_CHARS[id];
    const sel = teamIds.includes(id);
    return `<button class="cCard ${sel ? 'selected' : ''}" onclick="toggleMember(${id})">
      <b>[${ch.rare}]</b><br>${ch.full}<br>${ch.cost}両
    </button>`;
  }).join('');
}

function toggleMember(id) {
  if (teamIds.includes(id)) {
    if (teamIds.length > 1) teamIds = teamIds.filter(x => x !== id);
  } else {
    if (teamIds.length < 3) teamIds.push(id);
    else { teamIds.shift(); teamIds.push(id); }
  }
  renderTeam();
}

function unit(slotIdx) {
  const ch = ALL_CHARS[teamIds[slotIdx]];
  if (!ch || over || mny < ch.cost) return;
  mny -= ch.cost;
  al.push({ ...ch, mHp: ch.hp, x: 600, y: 145, tm: 0 });
}

function addEn(boss) {
  const s = STS[st], m = 1 + st * 0.25;
  en.push({
    n: boss ? s.e2 : s.e1, c: boss ? '#8e44ad' : '#e74c3c',
    hp: Math.round((boss ? 250 : 120) * m), mHp: Math.round((boss ? 250 : 120) * m),
    atk: Math.round((boss ? 40 : 16) * m), r: boss ? 40 : 35, sp: boss ? 2.4 : 1.2, cd: boss ? 50 : 45,
    x: 90, y: 145, tm: 0
  });
}

function play(idx) {
  st = idx; go('battle');
  mny = 100; pHp = 1000; eHp = STS[st].hp; over = false;
  al = []; en = []; bl = []; cnt = 0; tM = Date.now(); tE = Date.now();
  document.getElementById('stName').textContent = STS[st].n;
  document.getElementById('backMap').style.display = 'none';

  for (let i = 0; i < 3; i++) {
    const btn = document.getElementById('b' + i);
    const ch = ALL_CHARS[teamIds[i]];
    if (ch) {
      btn.style.display = 'block';
      btn.innerHTML = `${ch.n}<br>${ch.cost}両`;
    } else {
      btn.style.display = 'none';
    }
  }
  addEn(false);
  requestAnimationFrame(loop);
}

function drawU(u, isAl) {
ctx.fillStyle = u.c; ctx.fillRect(u.x - 18, u.y - 15, 36, 36);
ctx.strokeStyle = '#fff'; ctx.strokeRect(u.x - 18, u.y - 15, 36, 36);
ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
ctx.fillText(u.n, u.x, u.y + 7);
ctx.fillStyle = '#333'; ctx.fillRect(u.x - 16, u.y - 23, 32, 4);
ctx.fillStyle = isAl ? '#4cd137' : '#ff4757';
ctx.fillRect(u.x - 16, u.y - 23, 32 * Math.max(0, u.hp / u.mHp), 4);
}
function loop() {
if (over) return;
const now = Date.now();
if (now - tM >= 1000) { mny = Math.min(1000, mny + 15); tM += 1000; }
if (now - tE >= STS[st].ms) { cnt++; addEn(cnt % 3 === 0); tE = now; }
document.getElementById('mny').textContent = mny;
document.getElementById('pHp').textContent = Math.max(0, pHp);
document.getElementById('eHp').textContent = Math.max(0, eHp);
for (let i = 0; i < 3; i++) {
const ch = ALL_CHARS[teamIds[i]];
if (ch) document.getElementById('b' + i).disabled = mny < ch.cost;
}
ctx.clearRect(0, 0, 700, 220);
ctx.fillStyle = '#558b2f'; ctx.fillRect(0, 168, 700, 52);
ctx.fillStyle = '#c23616'; ctx.fillRect(20, 88, 55, 80);
ctx.fillStyle = '#273c75'; ctx.fillRect(625, 88, 55, 80);
al.forEach(a => {
if (a.tm > 0) a.tm--;
const t = en.find(e => a.x >= e.x - 10 && a.x - e.x <= a.r);
if (t) {
if (a.tm === 0) {
if (a.gun) bl.push({ x: a.x - 15, y: a.y, t, atk: a.atk });
else t.hp -= a.atk;
a.tm = a.cd;
}
} else if (a.x - 75 <= a.r) {
if (a.tm === 0) {
if (a.gun) bl.push({ x: a.x - 15, y: a.y, castle: true, atk: a.atk });
else eHp -= a.atk;
a.tm = a.cd;
}
} else {
a.x -= a.sp;
}
drawU(a, true);
});
en.forEach(e => {
if (e.tm > 0) e.tm--;
const t = al.find(a => a.x >= e.x - 10 && a.x - e.x <= e.r);
if (t) {
if (e.tm === 0) { t.hp -= e.atk; e.tm = e.cd; }
} else if (625 - e.x <= e.r) {
if (e.tm === 0) { pHp -= e.atk; e.tm = e.cd; }
} else {
e.x += e.sp;
}
drawU(e, false);
});
ctx.fillStyle = '#ffd32a';
for (let i = bl.length - 1; i >= 0; i--) {
const b = bl[i]; b.x -= 10;
ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill();
if (b.castle && b.x <= 75) {
eHp -= b.atk; bl.splice(i, 1);
} else if (b.t && b.t.hp > 0 && b.x <= b.t.x) {
b.t.hp -= b.atk; bl.splice(i, 1);
} else if (b.x < 20) {
bl.splice(i, 1);
}
}
al = al.filter(a => a.hp > 0);
en = en.filter(e => e.hp > 0);
if (eHp <= 0 || pHp <= 0) {
over = true;
const isWin = eHp <= 0;
if (isWin) { wins++; updateWinUI(); }
ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, 700, 220);
ctx.fillStyle = '#ffd32a'; ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center';
ctx.fillText(isWin ? 'ステージクリア！（+1勝）' : '敗北…', 350, 110);
document.getElementById('backMap').style.display = 'block';
return;
}
requestAnimationFrame(loop);
}
initStages();
updateWinUI();
