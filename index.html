<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>戦国大戦争</title>
  <style>
    * { touch-action: manipulation; box-sizing: border-box; }
    body { margin: 0; padding: 10px; background: #1e272e; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
    .screen { width: 100%; max-width: 700px; display: none; flex-direction: column; align-items: center; }
    .screen.active { display: flex; }

    /* ホーム画面 */
    #homeScreen { height: 360px; background: linear-gradient(135deg, #2c3e50, #c0392b); border-radius: 12px; position: relative; border: 3px solid #ffd32a; }
    #homeTitle { margin-top: 25px; font-size: 26px; color: #ffd32a; text-shadow: 2px 2px 4px #000; }
    #startBtn { position: absolute; top: 34%; left: 26%; padding: 16px 28px; font-size: 20px; font-weight: bold; background: #ffd32a; color: #1e272e; border: 3px solid #fff; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer; }

    /* マップ画面 */
    #mapScreen { height: 360px; background: #2d5a27; border-radius: 12px; border: 3px solid #ffd32a; padding: 15px; justify-content: space-between; position: relative; }
    .map-path { display: flex; justify-content: space-around; align-items: center; width: 100%; height: 220px; background: rgba(0,0,0,0.2); border-radius: 8px; }
    .stage-btn { padding: 14px 10px; background: #e84118; color: #fff; border: 3px solid #ffd32a; border-radius: 50%; width: 95px; height: 95px; font-weight: bold; font-size: 13px; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.4); }
    .back-btn { padding: 8px 18px; background: #7f8fa6; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

    /* バトル画面 */
    #hud { width: 100%; display: flex; justify-content: space-between; background: #2f3640; padding: 10px; border-radius: 8px 8px 0 0; font-weight: bold; font-size: 14px; }
    #moneyDisplay { color: #ffd32a; }
    canvas { background: #87CEEB; width: 100%; height: 240px; display: block; border-left: 3px solid #2f3640; border-right: 3px solid #2f3640; }
    #controls { width: 100%; display: flex; gap: 8px; background: #2f3640; padding: 10px; border-radius: 0 0 8px 8px; }
    .unit-btn { flex: 1; padding: 10px 4px; border: 2px solid #ffd32a; border-radius: 8px; background: #40739e; color: #fff; font-weight: bold; font-size: 13px; }
    .unit-btn:disabled { opacity: 0.4; border-color: #7f8fa6; background: #353b48; }
    #toMapBtn { display: none; margin-top: 12px; padding: 12px 28px; font-size: 16px; font-weight: bold; background: #ffd32a; color: #1e272e; border: none; border-radius: 8px; }
  </style>
</head>
<body>

  <!-- 1. ホーム画面 -->
  <div id="homeScreen" class="screen active">
    <h1 id="homeTitle">⚔️ 戦国大戦争 〜三英傑の陣〜</h1>
    <button type="button" id="startBtn">出陣する！</button>
  </div>

  <!-- 2. マップ画面（3ステージ） -->
  <div id="mapScreen" class="screen">
    <h2 style="margin:5px 0; color:#ffd32a;">🗺️ 進軍マップ（ステージ選択）</h2>
    <div class="map-path">
      <button type="button" class="stage-btn" onclick="startStage(0)">第1戦<br>桶狭間</button>
      <button type="button" class="stage-btn" onclick="startStage(1)">第2戦<br>長篠の戦い</button>
      <button type="button" class="stage-btn" onclick="startStage(2)">第3戦<br>大坂の陣</button>
    </div>
    <button type="button" class="back-btn" onclick="showScreen('homeScreen')">ホームへ戻る</button>
  </div>

  <!-- 3. バトル画面 -->
  <div id="battleScreen" class="screen">
    <div id="hud">
      <div>連合城: <span id="playerHp">1000</span></div>
      <div id="stageTitle" style="color:#4cd137;">長篠の戦い</div>
      <div id="moneyDisplay">軍資金: <span id="money">500</span>両</div>
      <div><span id="enemyName">武田城</span>: <span id="enemyHp">1500</span></div>
    </div>
    <canvas id="gameCanvas" width="700" height="240"></canvas>
    <div id="controls">
      <button type="button" class="unit-btn" id="btnTokugawa">徳川（守り）<br>15両</button>
      <button type="button" class="unit-btn" id="btnToyotomi">豊臣（突撃）<br>30両</button>
      <button type="button" class="unit-btn" id="btnOda">織田（鉄砲）<br>50両</button>
    </div>
    <button type="button" id="toMapBtn" onclick="showScreen('mapScreen')">マップへ戻る</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let money = 500, playerHp = 1000, enemyHp = 1500, gameOver = true;
    let lastMoney = 0, lastEnemy = 0, enemyCount = 0, currentStage = 0;
    let allies = [], enemies = [], bullets = [];

    const STAGES = [
      { title: '第1戦：桶狭間', enemyCastle: '今川城', castleHp: 1000, spawnMs: 4500, footLabel: '今川', bossLabel: '義元' },
      { title: '第2戦：長篠の戦い', enemyCastle: '武田城', castleHp: 1500, spawnMs: 3800, footLabel: '武田', bossLabel: '赤備' },
      { title: '第3戦：大坂の陣', enemyCastle: '真田丸', castleHp: 2200, spawnMs: 3000, footLabel: '真田', bossLabel: '幸村' }
    ];

    const ALLIES = {
      tokugawa: { label: '徳川', color: '#2ecc71', cost: 15, hp: 320, atk: 12, range: 35, speed: 0.9, cd: 50 },
      toyotomi: { label: '豊臣', color: '#f1c40f', cost: 30, hp: 160, atk: 30, range: 40, speed: 1.8, cd: 35 },
      oda:      { label: '織田', color: '#3498db', cost: 50, hp: 90,  atk: 65, range: 190, speed: 1.0, cd: 65 }
    };

    function showScreen(id) {
      gameOver = true;
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    document.getElementById('startBtn').onclick = () => showScreen('mapScreen');
    document.getElementById('btnTokugawa').onclick = () => addAlly('tokugawa');
    document.getElementById('btnToyotomi').onclick = () => addAlly('toyotomi');
    document.getElementById('btnOda').onclick = () => addAlly('oda');

    function addAlly(k) {
      if (gameOver || money < ALLIES[k].cost) return;
      money -= ALLIES[k].cost;
      allies.push({ ...ALLIES[k], maxHp: ALLIES[k].hp, x: 600, y: 160, timer: 0 });
    }

    function addEnemy(isBoss) {
      const st = STAGES[currentStage];
      const mult = 1 + currentStage * 0.25;
      enemies.push({
        label: isBoss ? st.bossLabel : st.footLabel,
        color: isBoss ? '#8e44ad' : '#e74c3c',
        hp: Math.round((isBoss ? 250 : 120) * mult),
        maxHp: Math.round((isBoss ? 250 : 120) * mult),
        atk: Math.round((isBoss ? 40 : 16) * mult),
        range: isBoss ? 40 : 35,
        speed: isBoss ? 2.4 : 1.2,
        cd: isBoss ? 50 : 45,
        x: 90, y: 160, timer: 0
      });
    }

    function startStage(idx) {
      currentStage = idx;
      const st = STAGES[idx];
      showScreen('battleScreen');
      money = 500; playerHp = 1000; enemyHp = st.castleHp; gameOver = false;
      allies = []; enemies = []; bullets = []; enemyCount = 0;
      lastMoney = Date.now(); lastEnemy = Date.now();
      document.getElementById('stageTitle').textContent = st.title;
      document.getElementById('enemyName').textContent = st.enemyCastle;
      document.getElementById('toMapBtn').style.display = 'none';
      addEnemy(false);
      requestAnimationFrame(loop);
    }

    function drawUnit(u, isAlly) {
      ctx.fillStyle = u.color; ctx.fillRect(u.x - 16, u.y - 15, 32, 38);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(u.x - 16, u.y - 15, 32, 38);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(u.label, u.x, u.y + 8);
      ctx.fillStyle = '#333'; ctx.fillRect(u.x - 17, u.y - 25, 34, 5);
      ctx.fillStyle = isAlly ? '#4cd137' : '#ff4757';
      ctx.fillRect(u.x - 17, u.y - 25, 34 * Math.max(0, u.hp / u.maxHp), 5);
    }

    function loop() {
      if (gameOver) return;
      const now = Date.now(), st = STAGES[currentStage];
      if (now - lastMoney >= 1000) { money = Math.min(1000, money + 3); lastMoney += 1000; }
      if (now - lastEnemy >= st.spawnMs) {
        enemyCount++; addEnemy(enemyCount % 3 === 0); lastEnemy = now;
      }

      document.getElementById('money').textContent = money;
      document.getElementById('playerHp').textContent = Math.max(0, playerHp);
      document.getElementById('enemyHp').textContent = Math.max(0, enemyHp);
      document.getElementById('btnTokugawa').disabled = money < 15;
      document.getElementById('btnToyotomi').disabled = money < 30;
      document.getElementById('btnOda').disabled = money < 50;

      ctx.clearRect(0, 0, 700, 240);
      ctx.fillStyle = '#558b2f'; ctx.fillRect(0, 185, 700, 55);
      ctx.fillStyle = '#c23616'; ctx.fillRect(20, 95, 60, 90);
      ctx.fillStyle = '#273c75'; ctx.fillRect(620, 95, 60, 90);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(st.enemyCastle, 50, 85); ctx.fillText('連合城', 650, 85);

      allies.forEach(a => {
        if (a.timer > 0) a.timer--;
        const t = enemies.find(e => a.x >= e.x && a.x - e.x <= a.range);
        if (t) {
          if (a.timer === 0) {
            if (a.label === '織田') bullets.push({ x: a.x - 15, y: a.y, t, atk: a.atk });
            else t.hp -= a.atk;
            a.timer = a.cd;
          }
        } else if (a.x - 80 <= a.range) {
          if (a.timer === 0) { enemyHp -= a.atk; a.timer = a.cd; }
        } else a.x -= a.speed;
        drawUnit(a, true);
      });

      enemies.forEach(e => {
        if (e.timer > 0) e.timer--;
        const t = allies.find(a => a.x >= e.x && a.x - e.x <= e.range);
        if (t) {
          if (e.timer === 0) { t.hp -= e.atk; e.timer = e.cd; }
        } else if (620 - e.x <= e.range) {
          if (e.timer === 0) { playerHp -= e.atk; e.timer = e.cd; }
        } else e.x += e.speed;
        drawUnit(e, false);
      });

      ctx.fillStyle = '#ffd32a';
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i]; b.x -= 10;
