<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>戦国大戦争</title>
<style>
  * { touch-action: manipulation; box-sizing: border-box; }
  body { margin: 0; padding: 10px; background: #1e272e; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
  .box { width: 100%; max-width: 700px; display: none; flex-direction: column; align-items: center; }
  .show { display: flex; }

  /* ホーム画面 */
  #home { height: 340px; background: linear-gradient(135deg, #2c3e50, #8e2424); border: 3px solid #ffd32a; border-radius: 12px; position: relative; overflow: hidden; }
  #startBtn { position: absolute; top: 32%; left: 22%; padding: 15px 26px; font-size: 20px; font-weight: bold; background: #ffd32a; color: #000; border: 3px solid #fff; border-radius: 10px; cursor: pointer; z-index: 2; }
  .portraits { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; z-index: 1; }
  .p-card { background: rgba(0,0,0,0.75); border: 1.5px solid #ffd32a; border-radius: 6px; padding: 3px; text-align: center; width: 68px; }
  .p-card img { width: 100%; height: 76px; object-fit: cover; border-radius: 4px; display: block; }
  .p-card span { font-size: 11px; font-weight: bold; color: #ffd32a; display: block; margin-top: 2px; }

  /* マップ画面 */
  #map { height: 340px; background: #2d5a27; border: 3px solid #ffd32a; border-radius: 12px; padding: 15px; justify-content: space-between; }
  .stages { display: flex; justify-content: space-around; align-items: center; width: 100%; height: 190px; }
  .stBtn { width: 95px; height: 95px; border-radius: 50%; background: #e84118; color: #fff; border: 3px solid #ffd32a; font-weight: bold; font-size: 13px; cursor: pointer; }

  /* バトル画面 */
  #hud { width: 100%; display: flex; justify-content: space-between; background: #2f3640; padding: 8px; font-size: 13px; font-weight: bold; border-radius: 8px 8px 0 0; }
  canvas { background: #87CEEB; width: 100%; height: 220px; display: block; }
  #btns { width: 100%; display: flex; gap: 6px; background: #2f3640; padding: 8px; border-radius: 0 0 8px 8px; }
  .uBtn { flex: 1; padding: 10px 2px; background: #40739e; color: #fff; border: 2px solid #ffd32a; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; }
  .uBtn:disabled { opacity: 0.4; border-color: #777; cursor: not-allowed; }
  #backMap { display: none; margin-top: 10px; padding: 10px 24px; background: #ffd32a; color: #000; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>

<div id="home" class="box show">
  <h2 style="color:#ffd32a; margin-top:20px; text-shadow: 2px 2px 4px #000;">⚔️ 戦国大戦争 〜三英傑〜</h2>
  <button id="startBtn" onclick="go('map')">出陣する！</button>
  <div class="portraits">
    <div class="p-card">
      <img src="https://wikimedia.org" alt="織田信長">
      <span>織田信長</span>
    </div>
    <div class="p-card">
      <img src="https://wikimedia.org" alt="豊臣秀吉">
      <span>豊臣秀吉</span>
    </div>
    <div class="p-card">
      <img src="https://wikimedia.org" alt="徳川家康">
      <span>徳川家康</span>
    </div>
  </div>
</div>

<div id="map" class="box">
  <h3 style="color:#ffd32a; margin:0;">🗺️ ステージ選択</h3>
  <div class="stages">
    <button class="stBtn" onclick="play(0)">第1戦<br>桶狭間</button>
    <button class="stBtn" onclick="play(1)">第2戦<br>長篠</button>
    <button class="stBtn" onclick="play(2)">第3戦<br>大坂</button>
  </div>
  <button onclick="go('home')" style="padding:8px 16px; border-radius:6px; border:none; font-weight:bold;">ホームへ</button>
</div>

<div id="battle" class="box">
  <div id="hud">
    <div>味方城:<span id="pHp">1000</span></div>
    <div id="stName" style="color:#4cd137;">長篠</div>
    <div style="color:#ffd32a;">資金:<span id="mny">15</span>両</div>
    <div>敵城:<span id="eHp">1500</span></div>
  </div>
  <canvas id="cv" width="700" height="220"></canvas>
  <div id="btns">
    <button class="uBtn" id="b0" onclick="unit(0)">徳川(守)<br>15両</button>
    <button class="uBtn" id="b1" onclick="unit(1)">豊臣(攻)<br>30両</button>
    <button class="uBtn" id="b2" onclick="unit(2)">織田(銃)<br>50両</button>
  </div>
  <button id="backMap" onclick="go('map')">マップへ戻る</button>
</div>

<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let mny = 15, pHp = 1000, eHp = 1500, over = true, tM = 0, tE = 0, cnt = 0, st = 0;
let al = [], en = [], bl = [];
const STS = [
  { n: '桶狭間', hp: 1000, ms: 6000, e1: '今川', e2: '義元' },
  { n: '長篠', hp: 1500, ms: 5000, e1: '武田', e2: '赤備' },
  { n: '大坂', hp: 2200, ms: 4000, e1: '真田', e2: '幸村' }
];
const U = [
  { n: '徳川', c: '#2ecc71', cost: 15, hp: 320, atk: 12, r: 35, sp: 0.9, cd: 50 },
  { n: '豊臣', c: '#f1c40f', cost: 30, hp: 160, atk: 30, r: 40, sp: 1.8, cd: 35 },
  { n: '織田', c: '#3498db', cost: 50, hp: 90,  atk: 65, r: 190, sp: 1.0, cd: 65 }
];

function go(id) {
  over = true;
  document.querySelectorAll('.box').forEach(b => b.classList.remove('show'));
  document.getElementById(id).classList.add('show');
}

function unit(i) {
  if (over || mny < U[i].cost) return;
  mny -= U[i].cost;
  al.push({ ...U[i], mHp: U[i].hp, x: 600, y: 145, tm: 0 });
}

function addEn(boss) {
  const s = STS[st], m = 1 + st * 0.25;
  en.push({
    n: boss ? s.e2 : s.e1, c: boss ? '#8e44ad' : '#e74c3c',
    hp: Math.round((boss ? 250 : 120) * m), mHp: Math.round((boss ? 250 : 120) * m),
    atk: Math.round((boss ? 40 : 16) * m), r: boss ? 40 : 35, sp: boss ? 2.4 : 1.2, cd: boss ? 50 : 45,
    x: 90, y: 145, tm: 0
  });
}

function play(idx) {
  st = idx; go('battle');
  mny = 15; pHp = 1000; eHp = STS[st].hp; over = false;
  al = []; en = []; bl = []; cnt = 0; tM = Date.now(); tE = Date.now();
  document.getElementById('stName').textContent = STS[st].n;
  document.getElementById('backMap').style.display = 'none';
  addEn(false);
  requestAnimationFrame(loop);
}

function drawU(u, isAl) {
  ctx.fillStyle = u.c; ctx.fillRect(u.x - 16, u.y - 15, 32, 36);
  ctx.strokeStyle = '#fff'; ctx.strokeRect(u.x - 16, u.y - 15, 32, 36);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(u.n, u.x, u.y + 7);
  ctx.fillStyle = '#333'; ctx.fillRect(u.x - 16, u.y - 23, 32, 4);
  ctx.fillStyle = isAl ? '#4cd137' : '#ff4757';
  ctx.fillRect(u.x - 16, u.y - 23, 32 * Math.max(0, u.hp / u.mHp), 4);
}

function loop() {
  if (over) return;
  const now = Date.now();
  if (now - tM >= 1000) { mny = Math.min(1000, mny + 1); tM += 1000; }
  if (now - tE >= STS[st].ms) { cnt++; addEn(cnt % 3 === 0); tE = now; }

  document.getElementById('mny').textContent = mny;
  document.getElementById('pHp').textContent = Math.max(0, pHp);
  document.getElementById('eHp').textContent = Math.max(0, eHp);
  for (let i = 0; i < 3; i++) {
    document.getElementById('b' + i).disabled = mny < U[i].cost;
  }

  ctx.clearRect(0, 0, 700, 220);
  ctx.fillStyle = '#558b2f'; ctx.fillRect(0, 168, 700, 52);
  ctx.fillStyle = '#c23616'; ctx.fillRect(20, 88, 55, 80);
  ctx.fillStyle = '#273c75'; ctx.fillRect(625, 88, 55, 80);

  al.forEach(a => {
    if (a.tm > 0) a.tm--;
    const t = en.find(e => a.x >= e.x && a.x - e.x <= a.r);
    if (t) {
      if (a.tm === 0) {
        if (a.n === '織田') bl.push({ x: a.x - 15, y: a.y, t, atk: a.atk });
        else t.hp -= a.atk;
        a.tm = a.cd;
      }
    } else if (a.x - 75 <= a.r) { if (a.tm === 0) { eHp -= a.atk; a.tm = a.cd; } }
    else a.x -= a.sp;
    drawU(a, true);
  });

  en.forEach(e => {
    if (e.tm > 0) e.tm--;
    const t = al.find(a => a.x >= e.x && a.x - e.x <= e.r);
    if (t) { if (e.tm === 0) { t.hp -= e.atk; e.tm = e.cd; } }
    else if (625 - e.x <= e.r) { if (e.tm === 0) { pHp -= e.atk; e.tm = e.cd; } }
    else e.x += e.sp;
    drawU(e, false);
  });

  ctx.fillStyle = '#ffd32a';
  for (let i = bl.length - 1; i >= 0; i--) {
    const b = bl[i]; b.x -= 10;
    ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill();
    if (b.t && b.x <= b.t.x) { b.t.hp -= b.atk; bl.splice(i, 1); }
    else if (b.x < 0) bl.splice(i, 1);
  }

  al = al.filter(a => a.hp > 0);
  en = en.filter(e => e.hp > 0);

  if (eHp <= 0 || pHp <= 0) {
    over = true;
    ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, 700, 220);
    ctx.fillStyle = '#ffd32a'; ctx.font = 'bold 28px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(eHp <= 0 ? 'ステージクリア！' : '敗北…', 350, 110);
    document.getElementById('backMap').style.display = 'block';
    return;
  }
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
