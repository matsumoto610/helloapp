<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>戦国大戦争 〜織田・豊臣・徳川〜</title>
<style>
  body { margin: 0; background: #1a1c20; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  #app { width: 740px; height: 440px; background: #282c34; border: 2px solid #4a505c; border-radius: 10px; padding: 18px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; }
  .screen { display: none; width: 100%; height: 100%; flex-direction: column; }
  .active { display: flex; }
  button { cursor: pointer; border: 2px solid #f1c40f; border-radius: 6px; background: #2c3e50; color: #fff; font-weight: bold; }
  button:hover:not(:disabled) { background: #34495e; }
  button:disabled { border-color: #7f8c8d; background: #3b4048; color: #95a5a6; cursor: not-allowed; }
  #home { position: relative; }
  .home-title { color: #f1c40f; font-size: 22px; font-weight: bold; text-align: center; margin-top: 10px; }
  .win-badge { position: absolute; top: 12px; right: 16px; background: #1a1c20; padding: 6px 12px; border-radius: 6px; border: 1px solid #f1c40f; font-size: 14px; }
  .home-controls { position: absolute; top: 34%; left: 26%; width: 260px; display: flex; flex-direction: column; gap: 12px; }
  .btn-main-map { width: 100%; padding: 16px; font-size: 18px; background: #c0392b; }
  .btn-main-map:hover { background: #e74c3c; }
  .home-sub-btns { display: flex; gap: 10px; }
  .home-sub-btns button { flex: 1; padding: 12px; font-size: 15px; }
  .sub-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .sub-header h2 { margin: 0; color: #f1c40f; font-size: 20px; }
  .stage-list { display: flex; flex-direction: column; gap: 12px; margin: auto 0; }
  .stage-btn { padding: 16px; font-size: 16px; background: #2980b9; }
  .stage-btn:hover { background: #3498db; }
  #gachaResult { margin: 15px 0; padding: 18px; background: #1a1c20; border-radius: 8px; text-align: center; min-height: 60px; line-height: 1.6; }
  #teamSlots { display: flex; justify-content: center; gap: 12px; margin-bottom: 10px; }
  .slot { width: 160px; height: 56px; background: #1a1c20; border: 2px dashed #f1c40f; border-radius: 6px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 13px; }
  #charList { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; overflow-y: auto; flex: 1; padding: 4px; }
  .cCard { padding: 8px; font-size: 12px; border-color: #7f8c8d; }
  .cCard.selected { border-color: #2ecc71; background: #1e5631; }
  .battle-title { text-align: center; color: #f1c40f; font-size: 17px; font-weight: bold; margin-bottom: 6px; }
  .battle-bar { display: flex; justify-content: space-between; background: #353b48; padding: 6px 14px; font-size: 14px; font-weight: bold; border-radius: 4px 4px 0 0; }
  canvas { background: #87ceeb; display: block; width: 700px; height: 220px; margin: 0 auto; }
  .unit-bar { display: flex; gap: 10px; margin-top: 10px; flex: 1; }
  .unit-btn { flex: 1; font-size: 14px; line-height: 1.4; }
  #backMap { position: absolute; top: 52%; left: 50%; transform: translate(-50%, -50%); padding: 12px 24px; font-size: 16px; background: #e74c3c; display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="home" class="screen active">
    <div class="home-title">戦国大戦争 〜織田・豊臣・徳川〜</div>
    <div class="win-badge">勝利数：<span id="winCount">0</span>勝</div>
    <div class="home-controls">
      <button class="btn-main-map" onclick="go('map')">出陣（マップ）</button>
      <div class="home-sub-btns">
        <button onclick="openGacha()">ガチャ</button>
        <button onclick="openTeam()">編成</button>
      </div>
    </div>
  </div>
  <div id="map" class="screen">
    <div class="sub-header">
      <h2>合戦場選択</h2>
      <button onclick="go('home')" style="padding:6px 14px;">ホームへ戻る</button>
    </div>
    <div class="stage-list" id="stageList"></div>
  </div>
  <div id="gacha" class="screen">
    <div class="sub-header">
      <h2>武将ガチャ（全9種）</h2>
      <button onclick="go('home')" style="padding:6px 14px;">ホームへ戻る</button>
    </div>
    <p style="text-align:center; margin:4px 0;">所持勝利数：<span id="gachaWinCount">0</span>勝（次のガチャ必要勝利数：<span id="gachaNeed">0</span>勝）</p>
    <button id="gachaBtn" onclick="drawGacha()" style="padding:12px; font-size:16px; width:220px; margin:8px auto;">ガチャを引く</button>
    <div id="gachaResult">勝利数を貯めて新たな武将を手に入れよう！（初回は0勝で回せます）</div>
  </div>
  <div id="team" class="screen">
    <div class="sub-header">
      <h2>チーム編成（3体まで）</h2>
      <button onclick="go('home')" style="padding:6px 14px;">ホームへ戻る</button>
    </div>
    <div id="teamSlots"></div>
    <div id="charList"></div>
  </div>
  <div id="battle" class="screen">
    <div id="stName" class="battle-title">長篠の戦い 〜織田・豊臣・徳川〜</div>
    <div class="battle-bar">
      <span style="color:#ff7675;">敵城(左): <span id="eHp">1500</span></span>
      <span style="color:#f1c40f;">軍資金: <span id="mny">15</span>両</span>
      <span style="color:#74b9ff;">連合城(右): <span id="pHp">1000</span></span>
    </div>
    <canvas id="cv" width="700" height="220"></canvas>
    <div class="unit-bar">
      <button id="b0" class="unit-btn" onclick="unit(0)"></button>
      <button id="b1" class="unit-btn" onclick="unit(1)"></button>
      <button id="b2" class="unit-btn" onclick="unit(2)"></button>
    </div>
    <button id="backMap" onclick="go('map')">マップへ戻る</button>
  </div>
</div>
<script>
const ALL_CHARS = Array.of(
  { rare: 'N',   n: '徳川', full: '徳川 (守り)',   cost: 15,  hp: 200, atk: 10,  r: 30,  sp: 1.0, cd: 45, c: '#27ae60', gun: false },
  { rare: 'N',   n: '豊臣', full: '豊臣 (突撃)',   cost: 30,  hp: 110, atk: 24,  r: 35,  sp: 2.6, cd: 38, c: '#2980b9', gun: false },
  { rare: 'N',   n: '織田', full: '織田 (鉄砲)',   cost: 50,  hp: 80,  atk: 30,  r: 175, sp: 1.1, cd: 60, c: '#8e44ad', gun: true  },
  { rare: 'R',   n: '明智', full: '明智 (智謀)',   cost: 45,  hp: 130, atk: 28,  r: 120, sp: 1.5, cd: 50, c: '#16a085', gun: true  },
  { rare: 'R',   n: '柴田', full: '柴田 (鬼柴田)', cost: 70,  hp: 300, atk: 45,  r: 40,  sp: 1.5, cd: 45, c: '#c0392b', gun: false },
  { rare: 'SR',  n: '前田', full: '前田 (槍衾)',   cost: 90,  hp: 360, atk: 55,  r: 55,  sp: 1.6, cd: 42, c: '#f39c12', gun: false },
  { rare: 'SR',  n: '本多', full: '本多 (無双)',   cost: 130, hp: 520, atk: 85,  r: 45,  sp: 1.7, cd: 38, c: '#2ecc71', gun: false },
  { rare: 'SSR', n: '真田', full: '真田 (赤備え)', cost: 160, hp: 460, atk: 115, r: 40,  sp: 2.8, cd: 30, c: '#e74c3c', gun: false },
  { rare: 'UR',  n: '信長', full: '第六天魔王',    cost: 220, hp: 680, atk: 165, r: 210, sp: 1.2, cd: 65, c: '#9b59b6', gun: true  }
);

const STS = Array.of(
  { n: '長篠の戦い 〜織田・豊臣・徳川〜', hp: 1500, ms: 3200, e1: '武田足軽', e2: '武田騎馬' },
  { n: '関ヶ原の戦い 〜天下分け目〜',     hp: 2200, ms: 2700, e1: '西軍槍兵', e2: '石田三成' },
  { n: '大坂の陣 〜最終決戦〜',           hp: 3000, ms: 2200, e1: '大坂牢人', e2: '真田幸村' }
);

let wins = 0;
let gachaCount = 0;
let ownedIds = Array.of(0, 1, 2);
let teamIds = Array.of(0, 1, 2);
let st = 0, mny = 15, pHp = 1000, eHp = 1500, over = false;
let al = Array.of(), en = Array.of(), bl = Array.of(), cnt = 0, tM = 0, tE = 0;
const ctx = document.getElementById('cv').getContext('2d');

function go(id) {
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  updateWinUI();
}

function updateWinUI() {
  document.getElementById('winCount').textContent = wins;
  document.getElementById('gachaWinCount').textContent = wins;
  document.getElementById('gachaNeed').textContent = gachaCount;
  document.getElementById('gachaBtn').disabled = wins < gachaCount;
}

function initStages() {
  document.getElementById('stageList').innerHTML = STS.map((s, idx) =>
    `<button class="stage-btn" onclick="play(${idx})">${s.n}（敵城HP: ${s.hp}）</button>`
  ).join('');
}

function openGacha() {
  go('gacha');
  updateWinUI();
  document.getElementById('gachaResult').textContent = '勝利数を貯めて新たな武将を手に入れよう！';
}

function drawGacha() {
  if (wins < gachaCount) return;
  wins -= gachaCount;
  gachaCount++;
  updateWinUI();
  const pickedId = Math.floor(Math.random() * ALL_CHARS.length);
  const picked = ALL_CHARS[pickedId];
  const isNew = !ownedIds.includes(pickedId);
  if (isNew) {
    ownedIds.push(pickedId);
    if (teamIds.length < 3) teamIds.push(pickedId);
  }
  document.getElementById('gachaResult').innerHTML = `【${picked.rare}】<span style="font-size:20px; color:#fff;">${picked.full}</span> を獲得！<br><span style="font-size:12px; color:#4cd137;">${isNew ? '★NEW！編成でチームに入れられます' : '（すでに所持しています）'}</span>`;
  updateWinUI();
}

function openTeam() {
  go('team');
  renderTeam();
}

function renderTeam() {
  const slots = Array.of(0, 1, 2);
  document.getElementById('teamSlots').innerHTML = slots.map(idx => {
    const ch = ALL_CHARS[teamIds[idx]];
    return `<div class="slot">${ch ? `${ch.full}<br>${ch.cost}両` : '空き枠'}</div>`;
  }).join('');
  document.getElementById('charList').innerHTML = ownedIds.map(id => {
    const ch = ALL_CHARS[id];
    const sel = teamIds.includes(id);
    return `<button class="cCard ${sel ? 'selected' : ''}" onclick="toggleMember(${id})"><b>[${ch.rare}]</b> ${ch.full}<br>${ch.cost}両</button>`;
  }).join('');
}

function toggleMember(id) {
  if (teamIds.includes(id)) {
    if (teamIds.length > 1) teamIds = teamIds.filter(x => x !== id);
  } else {
    if (teamIds.length < 3) teamIds.push(id);
    else { teamIds.shift(); teamIds.push(id); }
  }
  renderTeam();
}

function unit(slotIdx) {
  const ch = ALL_CHARS[teamIds[slotIdx]];
  if (!ch || over || mny < ch.cost) return;
  mny -= ch.cost;
  al.push({ ...ch, mHp: ch.hp, x: 600, y: 145, tm: 0 });
}

function addEn(boss) {
  const s = STS[st], m = 1 + st * 0.25;
  en.push({
    n: boss ? s.e2 : s.e1, c: boss ? '#8e44ad' : '#e74c3c',
    hp: Math.round((boss ? 250 : 120) * m), mHp: Math.round((boss ? 250 : 120) * m),
atk: Math.round((boss ? 40 : 16) * m), r: boss ? 40 : 35, sp: boss ? 2.4 : 1.2, cd: boss ? 50 : 45,
x: 90, y: 145, tm: 0
});
}
function play(idx) {
st = idx; go('battle');
mny = 15; pHp = 1000; eHp = STS[st].hp; over = false;
al = Array.of(); en = Array.of(); bl = Array.of(); cnt = 0; tM = Date.now(); tE = Date.now();
document.getElementById('stName').textContent = STS[st].n;
document.getElementById('backMap').style.display = 'none';
for (let i = 0; i < 3; i++) {
const btn = document.getElementById('b' + i);
const ch = ALL_CHARS[teamIds[i]];
if (ch) { btn.style.display = 'block'; btn.innerHTML = ${ch.full}<br>${ch.cost}両; }
else { btn.style.display = 'none'; }
}
addEn(false);
requestAnimationFrame(loop);
}
function drawU(u, isAl) {
ctx.fillStyle = u.c; ctx.fillRect(u.x - 18, u.y - 15, 36, 36);
ctx.strokeStyle = '#fff'; ctx.strokeRect(u.x - 18, u.y - 15, 36, 36);
ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
ctx.fillText(u.n, u.x, u.y + 7);
ctx.fillStyle = '#333'; ctx.fillRect(u.x - 16, u.y - 23, 32, 4);
ctx.fillStyle = isAl ? '#4cd137' : '#ff4757';
ctx.fillRect(u.x - 16, u.y - 23, 32 * Math.max(0, u.hp / u.mHp), 4);
}
function loop() {
if (over) return;
const now = Date.now();
if (now - tM >= 1000) { mny = Math.min(1000, mny + 2); tM += 1000; }
if (now - tE >= STS[st].ms) { cnt++; addEn(cnt % 3 === 0); tE = now; }
document.getElementById('mny').textContent = mny;
document.getElementById('pHp').textContent = Math.max(0, pHp);
document.getElementById('eHp').textContent = Math.max(0, eHp);
for (let i = 0; i < 3; i++) {
const ch = ALL_CHARS[teamIds[i]];
if (ch) document.getElementById('b' + i).disabled = mny < ch.cost;
}
ctx.clearRect(0, 0, 700, 220);
ctx.fillStyle = '#558b2f'; ctx.fillRect(0, 168, 700, 52);
ctx.fillStyle = '#c23616'; ctx.fillRect(20, 88, 55, 80);
ctx.fillStyle = '#273c75'; ctx.fillRect(625, 88, 55, 80);
al.forEach(a => {
if (a.tm > 0) a.tm--;
const t = en.find(e => a.x >= e.x - 10 && a.x - e.x <= a.r);
if (t) {
if (a.tm === 0) {
if (a.gun) bl.push({ x: a.x - 15, y: a.y, t, atk: a.atk });
else t.hp -= a.atk;
a.tm = a.cd;
}
} else if (a.x - 75 <= a.r) {
if (a.tm === 0) {
if (a.gun) bl.push({ x: a.x - 15, y: a.y, castle: true, atk: a.atk });
else eHp -= a.atk;
a.tm = a.cd;
}
} else { a.x -= a.sp; }
drawU(a, true);
});
en.forEach(e => {
if (e.tm > 0) e.tm--;
const t = al.find(a => a.x >= e.x - 10 && a.x - e.x <= e.r);
if (t) { if (e.tm === 0) { t.hp -= e.atk; e.tm = e.cd; } }
else if (625 - e.x <= e.r) { if (e.tm === 0) { pHp -= e.atk; e.tm = e.cd; } }
else { e.x += e.sp; }
drawU(e, false);
});
ctx.fillStyle = '#ffd32a';
for (let i = bl.length - 1; i >= 0; i--) {
const b = bl[i]; b.x -= 10;
ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill();
if (b.castle && b.x <= 75) { eHp -= b.atk; bl.splice(i, 1); }
else if (b.t && b.t.hp > 0 && b.x <= b.t.x) { b.t.hp -= b.atk; bl.splice(i, 1); }
else if (b.x < 20) { bl.splice(i, 1); }
}
al = al.filter(a => a.hp > 0);
en = en.filter(e => e.hp > 0);
if (eHp <= 0 || pHp <= 0) {
over = true;
const isWin = eHp <= 0;
if (isWin) { wins++; updateWinUI(); }
ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, 700, 220);
ctx.fillStyle = '#ffd32a'; ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center';
ctx.fillText(isWin ? 'ステージクリア！（+1勝）' : '敗北…', 350, 110);
document.getElementById('backMap').style.display = 'block';
return;
}
requestAnimationFrame(loop);
}
initStages();
updateWinUI();
