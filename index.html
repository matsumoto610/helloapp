<!DOCTYPE html>

body{margin:0;background:#1e272e;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
#g{width:720px;max-width:96vw;background:#2f3640;border:2px solid #f1c40f;border-radius:10px;padding:12px;box-sizing:border-box;text-align:center}
.s{display:none;height:350px;flex-direction:column;justify-content:center;align-items:center;position:relative;border-radius:8px}.s.on{display:flex}
#s0{background:radial-gradient(circle,#353b48,#1e272e)}#s1{background:linear-gradient(135deg,#2c3e50,#1e272e)}
#s2{background:#3d5a3c;border:2px solid #78e08f}#s3{height:auto}#s4,#s5{background:#1e272e;border:1px solid #f1c40f;justify-content:flex-start;padding:38px 10px 40px;box-sizing:border-box}
.lg{font-size:40px;font-weight:bold;color:#f1c40f;text-shadow:3px 3px 0 #c23616;margin:-40px 0 28px}
.tg{position:absolute;top:10px;left:12px;font-size:15px;font-weight:bold;color:#f1c40f}
.kb{position:absolute;top:10px;right:12px;font-size:13px;font-weight:bold;color:#ffd32a;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:10px}
.mb{padding:10px 20px;font-size:15px;font-weight:bold;color:#fff;background:#c23616;border:2px solid #f1c40f;border-radius:8px;cursor:pointer}.mb:disabled{background:#57606f;border-color:#7f8fa6;color:#a4b0be}
.nd{position:absolute;border-radius:50px;transform:translate(-50%,-50%)}
.bb{position:absolute;bottom:10px;left:10px;padding:4px 10px;font-size:12px;background:#57606f;color:#fff;border:1px solid #a4b0be;border-radius:4px;cursor:pointer}
.br{width:100%;box-sizing:border-box;display:flex;justify-content:space-between;background:#1e272e;padding:6px 12px;border-radius:6px;font-weight:bold;font-size:14px;margin-bottom:6px}
canvas{border:2px solid #fff;border-radius:6px;display:block;width:100%;height:200px}
.bs{width:100%;display:flex;gap:6px;margin-top:8px}
.ub{flex:1;padding:8px 2px;font-size:12px;font-weight:bold;color:#fff;background:#273c75;border:2px solid #f1c40f;border-radius:8px;cursor:pointer}.ub:disabled{background:#57606f;border-color:#7f8fa6;color:#a4b0be}
#ed{display:none;gap:10px;margin-top:8px}.gr{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;width:100%;overflow-y:auto;margin-top:6px}
.cd{background:#2f3640;border:2px solid #7f8fa6;border-radius:6px;padding:5px 2px;font-size:11px;cursor:pointer}.cd.on{border-color:#f1c40f;background:#3d3d29}
</style>
</head>
<body>

<div id="s5" class="s"><div class="tg">部隊編成(4体まで)</div><div class="kb" id="dk"></div><div id="pl" class="gr"></div><button class="bb" onclick="go(1)">戻る</button></div>
</div>
<script>

let kb=300,ow=[0,1,2,3],dk=[0,1,2,3],cr=1,mn,ph,eh,ov,al,en,bl,tm,te,ts,ec,bt,bx,bc,id;

('+rm+'s)':'三段撃ち
発動！';c.clearRect(0,0,700,220);c.fillStyle='#558b2f';c.fillRect(0,168,700,52);c.fillStyle='#c23616';c.fillRect(20,88,55,80);c.fillStyle='#273c75';c.fillRect(625,88,55,80);if(bt>0){bt--;c.fillStyle=bc;c.fillRect(180,14,340,32);c.strokeStyle='#f1c40f';c.strokeRect(180,14,340,32);c.fillStyle='#f1c40f';c.font='bold 16px sans-serif';c.textAlign='center';c.fillText(bx,350,36)}al.forEach(a=>{if(a.k>0){let s=Math.min(18,a.k);a.x=Math.min(600,a.x+s);a.k-=s}else{if(a.o>0)a.o--;let t=en.find(e=>a.x>=e.x-45&&a.x-(e.x+e.z/2)<=a.g);if(t){if(!a.o){a.u?bl.push({x:a.x-15,y:148,a:a.a,f:1}):t.h-=a.a;a.o=a.d}}else if(a.x-75<=a.g){if(!a.o){a.u?bl.push({x:a.x-15,y:148,a:a.a,f:1}):eh-=a.a;a.o=a.d}}else a.x-=a.s}dr(a,1)});en.forEach(e=>{if(e.k>0){let s=Math.min(18,e.k);e.x=Math.max(100,e.x-s);e.k-=s}else{if(e.o>0)e.o--;let x=e.x+e.z/2,t=al.find(a=>(a.x-a.z/2)>=e.x-45&&(a.x-a.z/2)-x<=e.g);if(t){if(!e.o){e.u?bl.push({x:e.x+15,y:148,a:e.a,f:0}):t.h-=e.a;e.o=e.d}}else if(625-x<=e.g){if(!e.o){e.u?bl.push({x:e.x+15,y:148,a:e.a,f:0}):ph-=e.a;e.o=e.d}}else e.x+=e.s}dr(e,0)});for(let k=bl.length-1;k>=0;k--){let b=bl[k];b.x+=b.f?(b.p?-15:-10):10;c.fillStyle=b.p?'#ff3f34':(b.f?'#ffd32a':'#ff9f43');c.beginPath();c.arc(b.x,b.y,b.p?5:4,0,6.28);c.fill();let h=b.f?en.find(e=>e.h>0&&Math.abs(b.x-e.x)<=e.z/2):al.find(a=>a.h>0&&Math.abs(b.x-a.x)<=a.z/2);if(h){h.h-=b.a;bl.splice(k,1)}else if(b.f&&b.x<=75){eh-=b.a;bl.splice(k,1)}else if(!b.f&&b.x>=625){ph-=b.a;bl.splice(k,1)}else if(b.x<0||b.x>700)bl.splice(k,1)}al=al.filter(a=>a.h>0);mn=Math.min(1e3,mn+en.filter(e=>e.h<=0).length*5);en=en.filter(e=>e.h>0);if(eh<=0||ph<=0){ov=1;$('eh').textContent=Math.max(0,eh);$('ph').textContent=Math.max(0,ph);if(eh<=0)kb+=150;c.fillStyle='rgba(0,0,0,.7)';c.fillRect(0,0,700,220);c.fillStyle=eh<=0?'#f1c40f':'#ff6b81';c.font='bold 28px sans-serif';c.textAlign='center';c.fillText(eh<=0?'勝利！小判150両獲得！':'連合軍の敗北…',350,120);$('ed').style.display='flex';return}id=requestAnimationFrame(lp)}
