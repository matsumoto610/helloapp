<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>長篠の戦い</title>
<style>
  body {
    margin: 0;
    background: #1e272e;
    color: #fff;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  #game {
    width: 720px;
    max-width: 96vw;
    background: #2f3640;
    border: 2px solid #f1c40f;
    border-radius: 10px;
    padding: 16px;
    box-sizing: border-box;
    text-align: center;
  }
  h1 {
    margin: 0 0 10px;
    font-size: 20px;
    color: #f1c40f;
  }
  .status-bar {
    display: flex;
    justify-content: space-between;
    background: #1e272e;
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 15px;
    margin-bottom: 8px;
  }
  canvas {
    background: #87ceeb;
    border: 2px solid #fff;
    border-radius: 6px;
    display: block;
    width: 100%;
    height: 220px;
  }
  .controls {
    display: flex;
    gap: 12px;
    margin-top: 12px;
  }
  .unit-btn {
    flex: 1;
    padding: 14px 8px;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    background: #273c75;
    border: 2px solid #f1c40f;
    border-radius: 8px;
    cursor: pointer;
  }
  .unit-btn:hover:not(:disabled) {
    background: #40739e;
  }
  .unit-btn:disabled {
    background: #57606f;
    border-color: #7f8fa6;
    color: #a4b0be;
    cursor: not-allowed;
  }
  #restartBtn {
    display: none;
    margin: 12px auto 0;
    padding: 10px 24px;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    background: #e84118;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="game">
  <h1>長篠の戦い</h1>

  <div class="status-bar">
    <span style="color:#ff6b81;">武田城: <span id="enemyCastle">1500</span></span>
    <span style="color:#f1c40f;">軍資金: <span id="money">100</span>両</span>
    <span style="color:#70a1ff;">連合城: <span id="playerCastle">1000</span></span>
  </div>

  <canvas id="canvas" width="700" height="220"></canvas>

  <div class="controls">
    <button type="button" class="unit-btn" id="btn0" onclick="spawnAlly(0)">徳川 15両</button>
    <button type="button" class="unit-btn" id="btn1" onclick="spawnAlly(1)">豊臣 30両</button>
    <button type="button" class="unit-btn" id="btn2" onclick="spawnAlly(2)">織田 50両</button>
  </div>

  <button type="button" id="restartBtn" onclick="startGame()">再戦</button>
</div>

<script>
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');

  var UNIT_TYPES = new Array(
    { name: '徳川', cost: 15, hp: 220, atk: 12, range: 30,  speed: 1.0, cd: 45, color: '#27ae60', isGun: false },
    { name: '豊臣', cost: 30, hp: 120, atk: 26, range: 35,  speed: 2.5, cd: 38, color: '#2980b9', isGun: false },
    { name: '織田', cost: 50, hp: 80,  atk: 35, range: 175, speed: 1.1, cd: 60, color: '#8e44ad', isGun: true  }
  );

  var money = 100;
  var playerHp = 1000;
  var enemyHp = 1500;
  var isGameOver = false;

  var allies = new Array();
  var enemies = new Array();
  var bullets = new Array();

  var lastMoneyTime = 0;
  var lastEnemyTime = 0;
  var enemyCount = 0;

  function startGame() {
    money = 100;
    playerHp = 1000;
    enemyHp = 1500;
    isGameOver = false;
    allies = new Array();
    enemies = new Array();
    bullets = new Array();
    lastMoneyTime = Date.now();
    lastEnemyTime = Date.now();
    enemyCount = 0;

    document.getElementById('restartBtn').style.display = 'none';
    spawnEnemy(false);
    requestAnimationFrame(gameLoop);
  }

  function spawnAlly(typeIndex) {
    if (isGameOver) return;
    var u = UNIT_TYPES.at(typeIndex);
    if (money < u.cost) return;

    money -= u.cost;
    allies.push({
      name: u.name,
      hp: u.hp,
      maxHp: u.hp,
      atk: u.atk,
      range: u.range,
      speed: u.speed,
      cd: u.cd,
      color: u.color,
      isGun: u.isGun,
      x: 600,
      y: 145,
      timer: 0
    });
  }

  function spawnEnemy(isCavalry) {
    enemyCount++;
    enemies.push({
      name: isCavalry ? '騎馬' : '足軽',
      hp: isCavalry ? 240 : 110,
      maxHp: isCavalry ? 240 : 110,
      atk: isCavalry ? 38 : 15,
      range: 35,
      speed: isCavalry ? 2.4 : 1.2,
      cd: isCavalry ? 50 : 45,
      color: isCavalry ? '#8e44ad' : '#c0392b',
      x: 90,
      y: 145,
      timer: 0
    });
  }

  function drawUnit(u, isAlly) {
    ctx.fillStyle = u.color;
    ctx.fillRect(u.x - 18, u.y - 15, 36, 36);
    ctx.strokeStyle = '#fff';
    ctx.strokeRect(u.x - 18, u.y - 15, 36, 36);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(u.name, u.x, u.y + 7);

    ctx.fillStyle = '#333';
    ctx.fillRect(u.x - 16, u.y - 23, 32, 4);
    ctx.fillStyle = isAlly ? '#4cd137' : '#ff4757';
    ctx.fillRect(u.x - 16, u.y - 23, 32 * Math.max(0, u.hp / u.maxHp), 4);
  }

  function gameLoop() {
    if (isGameOver) return;

    var now = Date.now();
    if (now - lastMoneyTime >= 1000) {
      money = Math.min(1000, money + 2);
      lastMoneyTime += 1000;
    }
    if (now - lastEnemyTime >= 3200) {
      spawnEnemy((enemyCount + 1) % 3 === 0);
      lastEnemyTime = now;
    }

    document.getElementById('money').textContent = money;
    document.getElementById('playerCastle').textContent = Math.max(0, playerHp);
    document.getElementById('enemyCastle').textContent = Math.max(0, enemyHp);

    for (var i = 0; i < 3; i++) {
      document.getElementById('btn' + i).disabled = money < UNIT_TYPES.at(i).cost;
    }

    ctx.clearRect(0, 0, 700, 220);
    ctx.fillStyle = '#558b2f';
    ctx.fillRect(0, 168, 700, 52);

    ctx.fillStyle = '#c23616';
    ctx.fillRect(20, 88, 55, 80);

    ctx.fillStyle = '#273c75';
    ctx.fillRect(625, 88, 55, 80);

    for (var i = 0; i < allies.length; i++) {
      var a = allies.at(i);
      if (a.timer > 0) a.timer--;

      var target = enemies.find(function(e) { return a.x >= e.x - 10 && a.x - e.x <= a.range; });
      if (target) {
        if (a.timer === 0) {
          if (a.isGun) bullets.push({ x: a.x - 15, y: a.y, target: target, atk: a.atk, isCastle: false });
          else target.hp -= a.atk;
          a.timer = a.cd;
        }
      } else if (a.x - 75 <= a.range) {
        if (a.timer === 0) {
          if (a.isGun) bullets.push({ x: a.x - 15, y: a.y, target: null, atk: a.atk, isCastle: true });
          else enemyHp -= a.atk;
          a.timer = a.cd;
        }
      } else {
        a.x -= a.speed;
      }
      drawUnit(a, true);
    }

    for (var j = 0; j < enemies.length; j++) {
      var e = enemies.at(j);
      if (e.timer > 0) e.timer--;

      var targetAlly = allies.find(function(a) { return a.x >= e.x - 10 && a.x - e.x <= e.range; });
      if (targetAlly) {
        if (e.timer === 0) {
          targetAlly.hp -= e.atk;
          e.timer = e.cd;
        }
      } else if (625 - e.x <= e.range) {
        if (e.timer === 0) {
          playerHp -= e.atk;
          e.timer = e.cd;
        }
      } else {
        e.x += e.speed;
      }
      drawUnit(e, false);
    }

    ctx.fillStyle = '#ffd32a';
    for (var k = bullets.length - 1; k >= 0; k--) {
      var b = bullets.at(k);
      b.x -= 10;
      ctx.beginPath();
      ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
      ctx.fill();

      if (b.isCastle && b.x <= 75) {
        enemyHp -= b.atk;
        bullets.splice(k, 1);
      } else if (b.target && b.target.hp > 0 && b.x <= b.target.x) {
        b.target.hp -= b.atk;
        bullets.splice(k, 1);
      } else if (b.x < 20) {
        bullets.splice(k, 1);
      }
    }

    allies = allies.filter(function(a) { return a.hp > 0; });
    enemies = enemies.filter(function(e) { return e.hp > 0; });

    if (enemyHp <= 0 || playerHp <= 0) {
      isGameOver = true;
      var isWin = enemyHp <= 0;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
      ctx.fillRect(0, 0, 700, 220);
      ctx.fillStyle = '#ffd32a';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(isWin ? '勝利！' : '敗北…', 350, 115);
      document.getElementById('restartBtn').style.display = 'block';
      return;
    }

    requestAnimationFrame(gameLoop);
  }

  startGame();
</script>
</body>
</html>
