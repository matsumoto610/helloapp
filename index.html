<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>長篠の戦い 〜三英傑の陣〜</title>
  <style>
    body {
      margin: 0;
      padding: 10px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #1e272e;
      color: white;
      font-family: sans-serif;
      user-select: none;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 10px 0;
      color: #ffd32a;
    }

    #hud {
      width: 100%;
      max-width: 700px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #2f3640;
      padding: 8px 15px;
      border-radius: 8px 8px 0 0;
      box-sizing: border-box;
      font-weight: bold;
    }

    #moneyDisplay {
      color: #ffd32a;
      font-size: 18px;
    }

    canvas {
      background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 65%, #558b2f 65%, #33691e 100%);
      border-left: 3px solid #2f3640;
      border-right: 3px solid #2f3640;
      width: 100%;
      max-width: 700px;
      height: auto;
      display: block;
    }

    #controls {
      width: 100%;
      max-width: 700px;
      display: flex;
      gap: 8px;
      background: #2f3640;
      padding: 10px;
      border-radius: 0 0 8px 8px;
      box-sizing: border-box;
    }

    .unit-btn {
      flex: 1;
      padding: 10px 5px;
      border: 2px solid #7f8fa6;
      border-radius: 8px;
      background-color: #353b48;
      color: white;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.1s, background-color 0.2s;
    }

    .unit-btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    .unit-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .unit-btn.ready {
      border-color: #ffd32a;
      background-color: #40739e;
    }

    .unit-icon {
      font-size: 24px;
      margin-bottom: 4px;
    }

    .unit-name {
      font-size: 14px;
    }

    .unit-role {
      font-size: 11px;
      color: #dcdde1;
    }

    .unit-cost {
      font-size: 13px;
      color: #ffd32a;
      margin-top: 2px;
    }

    #restartBtn {
      display: none;
      margin-top: 15px;
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      background-color: #e84118;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>⚔️ 長篠の戦い 〜織田・豊臣・徳川 連合軍〜</h1>

  <div id="hud">
    <div>連合軍本陣: <span id="playerHp">1000</span></div>
    <div id="moneyDisplay">軍資金: <span id="money">500</span> / 1000両</div>
    <div>武田勝頼陣: <span id="enemyHp">1500</span></div>
  </div>

  <canvas id="gameCanvas" width="700" height="300"></canvas>

  <div id="controls">
    <button class="unit-btn" id="btnTokugawa" onclick="spawnPlayer('tokugawa')">
      <span class="unit-icon">🛡️</span>
      <span class="unit-name">徳川軍（馬防柵）</span>
      <span class="unit-role">高耐久・守り</span>
      <span class="unit-cost">15両</span>
    </button>
    <button class="unit-btn" id="btnToyotomi" onclick="spawnPlayer('toyotomi')">
      <span class="unit-icon">⚔️</span>
      <span class="unit-name">豊臣軍（突撃隊）</span>
      <span class="unit-role">素早い近接攻撃</span>
      <span class="unit-cost">30両</span>
    </button>
    <button class="unit-btn" id="btnOda" onclick="spawnPlayer('oda')">
      <span class="unit-icon">🔫</span>
      <span class="unit-name">織田軍（鉄砲隊）</span>
      <span class="unit-role">遠距離・高火力</span>
      <span class="unit-cost">50両</span>
    </button>
  </div>

  <button id="restartBtn" onclick="resetGame()">もう一度戦う！</button>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // ゲーム状態（初期軍資金500両・上限1000両）
    let money = 500;
    const maxMoney = 1000;
    let playerCastleHp = 1000;
    let enemyCastleHp = 1500;
    let gameOver = false;
    let winner = '';
    let lastMoneyTime = Date.now();
    let lastEnemyTime = Date.now();
    let enemySpawnCount = 0;

    // ユニットと弾の配列
    let allies = [];
    let enemies = [];
    let bullets = [];

    // 味方ユニット（徳川・豊臣・織田）
    const ALLY_TYPES = {
      tokugawa: { label: '徳川', icon: '🛡️', cost: 15, hp: 320, atk: 12, range: 30, speed: 0.9, atkSpeed: 50 },
      toyotomi: { label: '豊臣', icon: '⚔️', cost: 30, hp: 160, atk: 30, range: 35, speed: 1.8, atkSpeed: 35 },
      oda:      { label: '織田', icon: '🔫', cost: 50, hp: 90,  atk: 65, range: 190, speed: 1.0, atkSpeed: 65 }
    };

    // 敵ユニット（武田軍）
    const ENEMY_TYPES = {
      foot:    { label: '武田兵', icon: '👹', hp: 120, atk: 16, range: 30, speed: 1.2, atkSpeed: 45 },
      cavalry: { label: '赤備え', icon: '🐎', hp: 250, atk: 42, range: 35, speed: 2.5, atkSpeed: 50 }
    };

    // 味方出撃
    function spawnPlayer(typeKey) {
      if (gameOver) return;
      const spec = ALLY_TYPES[typeKey];
      if (money >= spec.cost) {
        money -= spec.cost;
        allies.push({
          ...spec,
          x: 610,
          y: 230,
          maxHp: spec.hp,
          cooldown: 0
        });
      }
    }

    // 敵出撃
    function spawnEnemy(typeKey) {
      const spec = ENEMY_TYPES[typeKey];
      enemies.push({
        ...spec,
        x: 70,
        y: 230,
        maxHp: spec.hp,
        cooldown: 0
      });
    }

    // ゲームリセット
    function resetGame() {
      money = 500;
      playerCastleHp = 1000;
      enemyCastleHp = 1500;
      allies = [];
      enemies = [];
      bullets = [];
      gameOver = false;
      winner = '';
      lastMoneyTime = Date.now();
      lastEnemyTime = Date.now();
      enemySpawnCount = 0;
      document.getElementById('restartBtn').style.display = 'none';

      // 開始と同時に最初の敵が1体出現
      spawnEnemy('foot');
      loop();
    }

    // 城の描画
    function drawCastles() {
      // 武田本陣（左）
      ctx.fillStyle = '#c23616';
      ctx.fillRect(20, 130, 60, 120);
      ctx.fillStyle = 'white';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('武田陣', 50, 120);

      // 連合軍本陣（右）
      ctx.fillStyle = '#273c75';
      ctx.fillRect(620, 130, 60, 120);
      ctx.fillStyle = 'white';
      ctx.fillText('連合陣', 650, 120);
    }

    // ユニットの描画（アイコン＋武将名＋HPバー）
    function drawUnit(u, isAlly) {
      ctx.font = '28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(u.icon, u.x, u.y);

      // 名前ラベル
      ctx.font = 'bold 11px sans-serif';
      ctx.fillStyle = isAlly ? '#003366' : '#660000';
      ctx.fillText(u.label, u.x, u.y + 15);

      // HPバー
      const barWidth = 34;
      const hpRatio = Math.max(0, u.hp / u.maxHp);
      ctx.fillStyle = '#333';
      ctx.fillRect(u.x - barWidth / 2, u.y - 32, barWidth, 5);
      ctx.fillStyle = isAlly ? '#4cd137' : '#e84118';
      ctx.fillRect(u.x - barWidth / 2, u.y - 32, barWidth * hpRatio, 5);
    }

    // メインループ
    function loop() {
      if (gameOver) return;
      const now = Date.now();

      // 1. 1秒につき3両増える
      if (now - lastMoneyTime >= 1000) {
        if (money < maxMoney) {
          money = Math.min(maxMoney, money + 3);
        }
        lastMoneyTime += 1000;
      }

      // 2. 敵の定期出現（4秒ごとに確実に敵が出現、3回に1回は強力な赤備え騎馬隊）
      if (now - lastEnemyTime >= 4000) {
        enemySpawnCount++;
        if (enemySpawnCount % 3 === 0) {
          spawnEnemy('cavalry');
        } else {
          spawnEnemy('foot');
        }
        lastEnemyTime = now;
      }

      // UI更新
      document.getElementById('money').textContent = money;
      document.getElementById('playerHp').textContent = Math.max(0, playerCastleHp);
      document.getElementById('enemyHp').textContent = Math.max(0, enemyCastleHp);

      const btnTokugawa = document.getElementById('btnTokugawa');
      const btnToyotomi = document.getElementById('btnToyotomi');
      const btnOda = document.getElementById('btnOda');

      btnTokugawa.disabled = money < 15;
      btnTokugawa.classList.toggle('ready', money >= 15);

      btnToyotomi.disabled = money < 30;
      btnToyotomi.classList.toggle('ready', money >= 30);

      btnOda.disabled = money < 50;
      btnOda.classList.toggle('ready', money >= 50);

      // 3. 画面クリア＆城の描画
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawCastles();

      // 4. 味方ユニット（右から左へ進軍）
      for (let i = allies.length - 1; i >= 0; i--) {
        const a = allies[i];
        if (a.cooldown > 0) a.cooldown--;

        let target = enemies.find(e => Math.abs(a.x - e.x) <= a.range && a.x >= e.x);
        let hitCastle = (a.x - 80) <= a.range;

        if (target) {
          if (a.cooldown === 0) {
            if (a.label === '織田') {
              bullets.push({ x: a.x - 15, y: a.y - 10, target: target, atk: a.atk });
            } else {
              target.hp -= a.atk;
            }
            a.cooldown = a.atkSpeed;
          }
        } else if (hitCastle) {
          if (a.cooldown === 0) {
            enemyCastleHp -= a.atk;
            a.cooldown = a.atkSpeed;
          }
        } else {
          a.x -= a.speed;
        }

        drawUnit(a, true);
      }

      // 5. 敵ユニット（左から右へ進軍）
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (e.cooldown > 0) e.cooldown--;

        let target = allies.find(a => Math.abs(a.x - e.x) <= e.range && a.x >= e.x);
        let hitCastle = (620 - e.x) <= e.range;

        if (target) {
          if (e.cooldown === 0) {
            target.hp -= e.atk;
            e.cooldown = e.atkSpeed;
          }
        } else if (hitCastle) {
          if (e.cooldown === 0) {
            playerCastleHp -= e.atk;
            e.cooldown = e.atkSpeed;
          }
        } else {
          e.x += e.speed;
        }

        drawUnit(e, false);
      }

      // 6. 織田鉄砲隊の弾丸処理
      ctx.fillStyle = '#ffd32a';
