<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>長篠の戦い</title>
<style>
  body { margin: 0; background: #1e272e; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  #game { width: 720px; max-width: 96vw; background: #2f3640; border: 2px solid #f1c40f; border-radius: 10px; padding: 16px; box-sizing: border-box; text-align: center; }
  h1 { margin: 0 0 10px; font-size: 20px; color: #f1c40f; }
  .status-bar { display: flex; justify-content: space-between; background: #1e272e; padding: 8px 16px; border-radius: 6px; font-weight: bold; font-size: 15px; margin-bottom: 8px; }
  canvas { background: #87ceeb; border: 2px solid #fff; border-radius: 6px; display: block; width: 100%; height: 220px; }
  .controls { display: flex; gap: 12px; margin-top: 12px; }
  .unit-btn { flex: 1; padding: 14px 8px; font-size: 16px; font-weight: bold; color: #fff; background: #273c75; border: 2px solid #f1c40f; border-radius: 8px; cursor: pointer; }
  .unit-btn:hover:not(:disabled) { background: #40739e; }
  .unit-btn:disabled { background: #57606f; border-color: #7f8fa6; color: #a4b0be; cursor: not-allowed; }
  #restartBtn { display: none; margin: 12px auto 0; padding: 10px 24px; font-size: 16px; font-weight: bold; color: #fff; background: #e84118; border: none; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>
<div id="game">
  <h1>長篠の戦い</h1>
  <div class="status-bar">
    <span style="color:#ff6b81;">武田城: <span id="enemyCastle">1500</span></span>
    <span style="color:#f1c40f;">軍資金: <span id="money">50</span>両</span>
    <span style="color:#70a1ff;">連合城: <span id="playerCastle">1000</span></span>
  </div>
  <canvas id="canvas" width="700" height="220"></canvas>
  <div class="controls">
    <button type="button" class="unit-btn" id="btn0" onclick="spawnAlly(0)">徳川 15両</button>
    <button type="button" class="unit-btn" id="btn1" onclick="spawnAlly(1)">豊臣 30両</button>
    <button type="button" class="unit-btn" id="btn2" onclick="spawnAlly(2)">織田 50両</button>
  </div>
  <button type="button" id="restartBtn" onclick="startGame()">再戦</button>
</div>
<script>
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');

  var UNIT_TYPES = [
    { name: '徳川', cost: 15, hp: 300, atk: 16, range: 30,  speed: 1.0, cd: 40, color: '#27ae60', textColor: '#fff',    isGun: false },
    { name: '豊臣', cost: 30, hp: 160, atk: 34, range: 35,  speed: 2.5, cd: 35, color: '#f1c40f', textColor: '#1e272e', isGun: false },
    { name: '織田', cost: 50, hp: 100, atk: 48, range: 185, speed: 1.1, cd: 50, color: '#8e44ad', textColor: '#fff',    isGun: true  }
  ];

  var money = 50, playerHp = 1000, enemyHp = 1500, isGameOver = false;
  var allies = [], enemies = [], bullets = [];
  var lastMoneyTime = 0, lastEnemyTime = 0, enemyCount = 0, bossAlertTimer = 0;

  function startGame() {
    money = 50; playerHp = 1000; enemyHp = 1500; isGameOver = false;
    allies = []; enemies = []; bullets = [];
    lastMoneyTime = Date.now(); lastEnemyTime = Date.now();
    enemyCount = 0; bossAlertTimer = 0;
    document.getElementById('restartBtn').style.display = 'none';
    spawnEnemy();
    requestAnimationFrame(gameLoop);
  }

  function spawnAlly(i) {
    if (isGameOver) return;
    var u = UNIT_TYPES[i];
    if (money < u.cost) return;
    money -= u.cost;
    allies.push({
      name: u.name, hp: u.hp, maxHp: u.hp, atk: u.atk, range: u.range,
      speed: u.speed, cd: u.cd, color: u.color, textColor: u.textColor,
      isGun: u.isGun, size: 36, x: 600, y: 166, timer: 0
    });
  }

  function spawnEnemy() {
    enemyCount++;
    var isBoss = (enemyCount % 8 === 0);
    var isCavalry = (!isBoss && enemyCount % 4 === 0);
    if (isBoss) {
      bossAlertTimer = 120;
      enemies.push({
        name: '勝頼', hp: 1200, maxHp: 1200, atk: 75, range: 50, speed: 0.9, cd: 60,
        color: '#b71540', borderColor: '#f1c40f', textColor: '#f1c40f',
        size: 68, x: 100, y: 166, timer: 0
      });
    } else {
      enemies.push({
        name: isCavalry ? '赤備' : '武田',
        hp: isCavalry ? 200 : 100, maxHp: isCavalry ? 200 : 100,
        atk: isCavalry ? 28 : 12, range: 35, speed: isCavalry ? 2.0 : 1.1,
        cd: isCavalry ? 55 : 48,
        color: isCavalry ? '#8e44ad' : '#c0392b', borderColor: '#fff', textColor: '#fff',
        size: 36, x: 90, y: 166, timer: 0
      });
    }
  }

  function drawUnit(u, isAlly) {
    var s = u.size || 36, half = s / 2, topY = u.y - s;
    ctx.fillStyle = u.color;
    ctx.fillRect(u.x - half, topY, s, s);
    ctx.lineWidth = s > 40 ? 3 : 1;
    ctx.strokeStyle = u.borderColor || '#fff';
    ctx.strokeRect(u.x - half, topY, s, s);
    ctx.lineWidth = 1;
    ctx.fillStyle = u.textColor || '#fff';
    ctx.font = (s > 40 ? 'bold 18px sans-serif' : 'bold 12px sans-serif');
    ctx.textAlign = 'center';
    ctx.fillText(u.name, u.x, topY + half + (s > 40 ? 6 : 4));
    var barW = s - 4;
    ctx.fillStyle = '#333';
    ctx.fillRect(u.x - barW / 2, topY - 8, barW, 5);
    ctx.fillStyle = isAlly ? '#4cd137' : '#ff4757';
    ctx.fillRect(u.x - barW / 2, topY - 8, barW * Math.max(0, u.hp / u.maxHp), 5);
  }

  function gameLoop() {
    if (isGameOver) return;
    var now = Date.now();
    if (now - lastMoneyTime >= 1000) { money = Math.min(1000, money + 3); lastMoneyTime += 1000; }
    if (now - lastEnemyTime >= 4500) { spawnEnemy(); lastEnemyTime = now; }

    document.getElementById('money').textContent = money;
    document.getElementById('playerCastle').textContent = Math.max(0, playerHp);
    document.getElementById('enemyCastle').textContent = Math.max(0, enemyHp);
    for (var i = 0; i < 3; i++) document.getElementById('btn' + i).disabled = money < UNIT_TYPES[i].cost;

    ctx.clearRect(0, 0, 700, 220);
    ctx.fillStyle = '#558b2f'; ctx.fillRect(0, 168, 700, 52);
    ctx.fillStyle = '#c23616'; ctx.fillRect(20, 88, 55, 80);
    ctx.fillStyle = '#273c75'; ctx.fillRect(625, 88, 55, 80);

    if (bossAlertTimer > 0) {
      bossAlertTimer--;
      ctx.fillStyle = 'rgba(183, 21, 64, 0.85)'; ctx.fillRect(200, 16, 300, 32);
      ctx.strokeStyle = '#f1c40f'; ctx.strokeRect(200, 16, 300, 32);
      ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('敵将・武田勝頼 出陣！', 350, 38);
    }

    for (var i = 0; i < allies.length; i++) {
      var a = allies[i];
      if (a.timer > 0) a.timer--;
      var target = enemies.find(function(e) { var fx = e.x + (e.size || 36) / 2; return a.x >= e.x - 10 && a.x - fx <= a.range; });
      if (target) {
        if (a.timer === 0) {
          if (a.isGun) bullets.push({ x: a.x - 15, y: a.y - 18, target: target, atk: a.atk, isCastle: false });
          else target.hp -= a.atk;
          a.timer = a.cd;
        }
      } else if (a.x - 75 <= a.range) {
        if (a.timer === 0) {
          if (a.isGun) bullets.push({ x: a.x - 15, y: a.y - 18, target: null, atk: a.atk, isCastle: true });
          else enemyHp -= a.atk;
          a.timer = a.cd;
        }
      } else { a.x -= a.speed; }
      drawUnit(a, true);
    }

    for (var j = 0; j < enemies.length; j++) {
      var e = enemies[j];
      if (e.timer > 0) e.timer--;
      var fx = e.x + (e.size || 36) / 2;
      var targetAlly = allies.find(function(a) { var afx = a.x - (a.size || 36) / 2; return afx >= e.x - 10 && afx - fx <= e.range; });
      if (targetAlly) {
        if (e.timer === 0) { targetAlly.hp -= e.atk; e.timer = e.cd; }
      } else if (625 - fx <= e.range) {
        if (e.timer === 0) { playerHp -= e.atk; e.timer = e.cd; }
      } else { e.x += e.speed; }
      drawUnit(e, false);
    }

    ctx.fillStyle = '#ffd32a';
    for (var k = bullets.length - 1; k >= 0; k--) {
      var b = bullets[k];
      b.x -= 10;
      ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill();
      if (b.isCastle && b.x <= 75) { enemyHp -= b.atk; bullets.splice(k, 1); }
      else if (b.target && b.target.hp > 0 && b.x <= b.target.x + (b.target.size || 36) / 2) { b.target.hp -= b.atk; bullets.splice(k, 1); }
      else if (b.x < 20) { bullets.splice(k, 1); }
    }

    enemies = enemies.filter(function(e) { return e.hp > 0; });
    allies = allies.filter(function(a) { return a.hp > 0; });

    if (enemyHp <= 0 || playerHp <= 0) {
      isGameOver = true;
      var isWin = enemyHp <= 0;
      document.getElementById('playerCastle').textContent = Math.max(0, playerHp);
      document.getElementById('enemyCastle').textContent = Math.max(0, enemyHp);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.75)'; ctx.fillRect(0, 0, 700, 220);
      ctx.fillStyle = '#ffd32a'; ctx.font = 'bold 28px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(isWin ? '勝利！' : '敗北…', 350, 115);
      document.getElementById('restartBtn').style.display = 'block';
      return;
    }
    requestAnimationFrame(gameLoop);
  }

  startGame();
</script>
</body>
</html>
