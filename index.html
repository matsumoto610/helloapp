<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>にゃんこ長篠の戦い</title>
  <style>
    body {
      margin: 0;
      padding: 10px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #1e272e;
      color: white;
      font-family: sans-serif;
      user-select: none;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 10px 0;
      color: #ffd32a;
    }

    #hud {
      width: 100%;
      max-width: 700px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #2f3640;
      padding: 8px 15px;
      border-radius: 8px 8px 0 0;
      box-sizing: border-box;
      font-weight: bold;
    }

    #moneyDisplay {
      color: #ffd32a;
      font-size: 18px;
    }

    canvas {
      background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 65%, #558b2f 65%, #33691e 100%);
      border-left: 3px solid #2f3640;
      border-right: 3px solid #2f3640;
      width: 100%;
      max-width: 700px;
      height: auto;
      display: block;
    }

    #controls {
      width: 100%;
      max-width: 700px;
      display: flex;
      gap: 8px;
      background: #2f3640;
      padding: 10px;
      border-radius: 0 0 8px 8px;
      box-sizing: border-box;
    }

    .unit-btn {
      flex: 1;
      padding: 10px 5px;
      border: 2px solid #7f8fa6;
      border-radius: 8px;
      background-color: #353b48;
      color: white;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.1s, background-color 0.2s;
    }

    .unit-btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    .unit-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .unit-btn.ready {
      border-color: #ffd32a;
      background-color: #40739e;
    }

    .unit-icon {
      font-size: 24px;
      margin-bottom: 4px;
    }

    .unit-name {
      font-size: 13px;
    }

    .unit-cost {
      font-size: 12px;
      color: #ffd32a;
      margin-top: 2px;
    }

    #restartBtn {
      display: none;
      margin-top: 15px;
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      background-color: #e84118;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>🐱 長篠の戦い 〜にゃんこ三段撃ち〜</h1>

  <div id="hud">
    <div>織田・徳川城: <span id="playerHp">1000</span></div>
    <div id="moneyDisplay">軍資金: <span id="money">0</span> / 500両</div>
    <div>武田本陣: <span id="enemyHp">1500</span></div>
  </div>

  <canvas id="gameCanvas" width="700" height="300"></canvas>

  <div id="controls">
    <button class="unit-btn" id="btnFence" onclick="spawnPlayer('fence')">
      <span class="unit-icon">🚧</span>
      <span class="unit-name">馬防柵にゃんこ</span>
      <span class="unit-cost">50両</span>
    </button>
    <button class="unit-btn" id="btnAshigaru" onclick="spawnPlayer('ashigaru')">
      <span class="unit-icon">🐱</span>
      <span class="unit-name">足軽にゃんこ</span>
      <span class="unit-cost">100両</span>
    </button>
    <button class="unit-btn" id="btnGunner" onclick="spawnPlayer('gunner')">
      <span class="unit-icon">🔫</span>
      <span class="unit-name">鉄砲隊にゃんこ</span>
      <span class="unit-cost">200両</span>
    </button>
  </div>

  <button id="restartBtn" onclick="resetGame()">もう一度戦う！</button>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // ゲーム状態
    let money = 0;
    const maxMoney = 500;
    let playerCastleHp = 1000;
    let enemyCastleHp = 1500;
    let gameOver = false;
    let winner = '';
    let frameCount = 0;
    let lastMoneyTime = Date.now(); // 時間計測用

    // ユニットと弾の配列
    let allies = [];
    let enemies = [];
    let bullets = [];

    // 味方ユニットのステータス定義
    const ALLY_TYPES = {
      fence: { name: '馬防柵', icon: '🚧', cost: 50, hp: 350, atk: 2, range: 25, speed: 0.5, atkSpeed: 60 },
      ashigaru: { name: '足軽', icon: '🐱', cost: 100, hp: 140, atk: 22, range: 30, speed: 1.4, atkSpeed: 40 },
      gunner: { name: '鉄砲隊', icon: '🔫', cost: 200, hp: 80, atk: 55, range: 180, speed: 0.8, atkSpeed: 75 }
    };

    // 敵ユニットのステータス定義（武田軍）
    const ENEMY_TYPES = {
      foot: { name: '武田歩兵', icon: '👹', hp: 130, atk: 18, range: 30, speed: 1.3, atkSpeed: 45 },
      cavalry: { name: '赤備え騎馬隊', icon: '🐎', hp: 260, atk: 45, range: 35, speed: 2.8, atkSpeed: 50 }
    };

    // 味方出撃処理
    function spawnPlayer(typeKey) {
      if (gameOver) return;
      const spec = ALLY_TYPES[typeKey];
      if (money >= spec.cost) {
        money -= spec.cost;
        allies.push({
          ...spec,
          x: 610, // 右側の自城から出撃
          y: 225,
          maxHp: spec.hp,
          cooldown: 0
        });
      }
    }

    // 敵出撃処理
    function spawnEnemy(typeKey) {
      const spec = ENEMY_TYPES[typeKey];
      enemies.push({
        ...spec,
        x: 60, // 左側の敵城から出撃
        y: 225,
        maxHp: spec.hp,
        cooldown: 0
      });
    }

    // ゲームリセット
    function resetGame() {
      money = 100;
      playerCastleHp = 1000;
      enemyCastleHp = 1500;
      allies = [];
      enemies = [];
      bullets = [];
      gameOver = false;
      winner = '';
      frameCount = 0;
      lastMoneyTime = Date.now();
      document.getElementById('restartBtn').style.display = 'none';
      loop();
    }

    // 城の描画
    function drawCastles() {
      // 武田本陣（左）
      ctx.fillStyle = '#c23616';
      ctx.fillRect(20, 130, 60, 120);
      ctx.fillStyle = 'white';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText('武田陣', 28, 120);

      // 織田・徳川城（右）
      ctx.fillStyle = '#273c75';
      ctx.fillRect(620, 130, 60, 120);
      ctx.fillStyle = 'white';
      ctx.fillText('織田陣', 628, 120);
    }

    // ユニットの描画
    function drawUnit(u, isAlly) {
      ctx.font = '32px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(u.icon, u.x, u.y);

      // HPバー
      const barWidth = 34;
      const hpRatio = Math.max(0, u.hp / u.maxHp);
      ctx.fillStyle = '#333';
      ctx.fillRect(u.x - barWidth / 2, u.y - 35, barWidth, 5);
      ctx.fillStyle = isAlly ? '#4cd137' : '#e84118';
      ctx.fillRect(u.x - barWidth / 2, u.y - 35, barWidth * hpRatio, 5);
    }

    // メインループ
    function loop() {
      if (gameOver) return;
      frameCount++;

      // 1. 軍資金の増加（1000ミリ秒＝1秒ごとに3両増える）
      const now = Date.now();
      if (now - lastMoneyTime >= 1000) {
        if (money < maxMoney) {
          money = Math.min(maxMoney, money + 3);
        }
        lastMoneyTime += 1000;
      }

      document.getElementById('money').textContent = money;
      document.getElementById('playerHp').textContent = Math.max(0, playerCastleHp);
      document.getElementById('enemyHp').textContent = Math.max(0, enemyCastleHp);

      const btnFence = document.getElementById('btnFence');
      const btnAshigaru = document.getElementById('btnAshigaru');
      const btnGunner = document.getElementById('btnGunner');

      btnFence.disabled = money < 50;
      btnFence.classList.toggle('ready', money >= 50);

      btnAshigaru.disabled = money < 100;
      btnAshigaru.classList.toggle('ready', money >= 100);

      btnGunner.disabled = money < 200;
      btnGunner.classList.toggle('ready', money >= 200);

      // 2. 敵の自動出現ロジック
      if (frameCount % 180 === 0) {
        spawnEnemy('foot');
      }
      if (frameCount % 420 === 0) {
        spawnEnemy('cavalry'); // 強力な赤備え騎馬隊が突撃してくる！
      }

      // 3. 画面クリア＆背景・城の描画
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawCastles();

      // 4. 味方ユニットの行動（右から左へ進む）
      for (let i = allies.length - 1; i >= 0; i--) {
        const a = allies[i];
        if (a.cooldown > 0) a.cooldown--;

        // 射程内に敵がいるか確認
        let target = enemies.find(e => Math.abs(a.x - e.x) <= a.range && a.x >= e.x);
        let hitCastle = (a.x - 80) <= a.range;

        if (target) {
          // 攻撃
          if (a.cooldown === 0) {
            if (a.name === '鉄砲隊') {
              bullets.push({ x: a.x - 15, y: a.y - 12, target: target, atk: a.atk });
            } else {
              target.hp -= a.atk;
            }
            a.cooldown = a.atkSpeed;
          }
        } else if (hitCastle) {
          // 敵城を攻撃
          if (a.cooldown === 0) {
            enemyCastleHp -= a.atk;
            a.cooldown = a.atkSpeed;
          }
        } else {
          // 前進
          a.x -= a.speed;
        }

        drawUnit(a, true);
      }

      // 5. 敵ユニットの行動（左から右へ進む）
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (e.cooldown > 0) e.cooldown--;

        let target = allies.find(a => Math.abs(a.x - e.x) <= e.range && a.x >= e.x);
        let hitCastle = (620 - e.x) <= e.range;

        if (target) {
          if (e.cooldown === 0) {
            target.hp -= e.atk;
            e.cooldown = e.atkSpeed;
          }
        } else if (hitCastle) {
          if (e.cooldown === 0) {
            playerCastleHp -= e.atk;
            e.cooldown = e.atkSpeed;
          }
        } else {
          e.x += e.speed;
        }

        drawUnit(e, false);
      }

      // 6. 鉄砲の弾丸処理
      ctx.fillStyle = '#ffd32a';
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x -= 10;
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();

        if (b.target && b.x <= b.target.x) {
          b.target.hp -= b.atk;
          bullets.splice(i, 1);
        } else if (b.x < 0) {
          bullets.splice(i, 1);
        }
      }

      // 7. HPが0になったユニットを削除
      allies = allies.filter(a => a.hp > 0);
      enemies = enemies.filter(e => e.hp > 0);

      // 8. 勝敗判定
