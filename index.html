<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>長篠の戦い</title>
  <style>
    * { touch-action: manipulation; box-sizing: border-box; }
    body { margin: 0; padding: 10px; background: #1e272e; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
    h1 { font-size: 18px; margin: 5px 0 10px; color: #ffd32a; }
    #hud { width: 100%; max-width: 700px; display: flex; justify-content: space-between; background: #2f3640; padding: 10px; border-radius: 8px 8px 0 0; font-weight: bold; font-size: 14px; }
    #moneyDisplay { color: #ffd32a; }
    canvas { background: #87CEEB; width: 100%; max-width: 700px; height: 250px; display: block; border-left: 3px solid #2f3640; border-right: 3px solid #2f3640; }
    #controls { width: 100%; max-width: 700px; display: flex; gap: 8px; background: #2f3640; padding: 10px; border-radius: 0 0 8px 8px; }
    .unit-btn { flex: 1; padding: 12px 4px; border: 2px solid #ffd32a; border-radius: 8px; background: #40739e; color: #fff; font-weight: bold; font-size: 14px; }
    .unit-btn:disabled { opacity: 0.4; border-color: #7f8fa6; background: #353b48; }
    #restartBtn { display: none; margin-top: 15px; padding: 12px 30px; font-size: 16px; font-weight: bold; background: #e84118; color: #fff; border: none; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>長篠の戦い 〜織田・豊臣・徳川〜</h1>
  <div id="hud">
    <div>連合城: <span id="playerHp">1000</span></div>
    <div id="moneyDisplay">軍資金: <span id="money">500</span>両</div>
    <div>武田城: <span id="enemyHp">1500</span></div>
  </div>
  <canvas id="gameCanvas" width="700" height="250"></canvas>
  <div id="controls">
    <button type="button" class="unit-btn" id="btnTokugawa">徳川（守り）<br>15両</button>
    <button type="button" class="unit-btn" id="btnToyotomi">豊臣（突撃）<br>30両</button>
    <button type="button" class="unit-btn" id="btnOda">織田（鉄砲）<br>50両</button>
  </div>
  <button type="button" id="restartBtn">もう一度戦う！</button>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let money = 500, playerHp = 1000, enemyHp = 1500, gameOver = false;
    let lastMoney = Date.now(), lastEnemy = Date.now(), enemyCount = 0;
    let allies = [], enemies = [], bullets = [];

    const ALLIES = {
      tokugawa: { label: '徳川', color: '#2ecc71', cost: 15, hp: 320, atk: 12, range: 35, speed: 0.9, cd: 50 },
      toyotomi: { label: '豊臣', color: '#f1c40f', cost: 30, hp: 160, atk: 30, range: 40, speed: 1.8, cd: 35 },
      oda:      { label: '織田', color: '#3498db', cost: 50, hp: 90,  atk: 65, range: 190, speed: 1.0, cd: 65 }
    };
    const ENEMIES = {
      foot:    { label: '武田', color: '#e74c3c', hp: 120, atk: 16, range: 35, speed: 1.2, cd: 45 },
      cavalry: { label: '赤備', color: '#8e44ad', hp: 250, atk: 42, range: 40, speed: 2.5, cd: 50 }
    };

    function addAlly(k) {
      if (gameOver || money < ALLIES[k].cost) return;
      money -= ALLIES[k].cost;
      allies.push({ ...ALLIES[k], maxHp: ALLIES[k].hp, x: 600, y: 170, timer: 0 });
    }
    function addEnemy(k) {
      enemies.push({ ...ENEMIES[k], maxHp: ENEMIES[k].hp, x: 90, y: 170, timer: 0 });
    }

    document.getElementById('btnTokugawa').onclick = () => addAlly('tokugawa');
    document.getElementById('btnToyotomi').onclick = () => addAlly('toyotomi');
    document.getElementById('btnOda').onclick = () => addAlly('oda');
    document.getElementById('restartBtn').onclick = init;

    function init() {
      money = 500; playerHp = 1000; enemyHp = 1500; gameOver = false;
      allies = []; enemies = []; bullets = []; enemyCount = 0;
      lastMoney = Date.now(); lastEnemy = Date.now();
      document.getElementById('restartBtn').style.display = 'none';
      addEnemy('foot');
      requestAnimationFrame(loop);
    }

    function drawUnit(u, isAlly) {
      ctx.fillStyle = u.color;
      ctx.fillRect(u.x - 16, u.y - 15, 32, 38);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.strokeRect(u.x - 16, u.y - 15, 32, 38);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(u.label, u.x, u.y + 8);
      ctx.fillStyle = '#333'; ctx.fillRect(u.x - 17, u.y - 25, 34, 5);
      ctx.fillStyle = isAlly ? '#4cd137' : '#ff4757';
      ctx.fillRect(u.x - 17, u.y - 25, 34 * Math.max(0, u.hp / u.maxHp), 5);
    }

    function loop() {
      if (gameOver) return;
      const now = Date.now();
      if (now - lastMoney >= 1000) { money = Math.min(1000, money + 3); lastMoney += 1000; }
      if (now - lastEnemy >= 4000) {
        enemyCount++;
        addEnemy(enemyCount % 3 === 0 ? 'cavalry' : 'foot');
        lastEnemy = now;
      }

      document.getElementById('money').textContent = money;
      document.getElementById('playerHp').textContent = Math.max(0, playerHp);
      document.getElementById('enemyHp').textContent = Math.max(0, enemyHp);
      document.getElementById('btnTokugawa').disabled = money < 15;
      document.getElementById('btnToyotomi').disabled = money < 30;
      document.getElementById('btnOda').disabled = money < 50;

      ctx.clearRect(0, 0, 700, 250);
      ctx.fillStyle = '#558b2f'; ctx.fillRect(0, 195, 700, 55);
      ctx.fillStyle = '#c23616'; ctx.fillRect(20, 105, 60, 90);
      ctx.fillStyle = '#273c75'; ctx.fillRect(620, 105, 60, 90);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('武田陣', 50, 95); ctx.fillText('連合陣', 650, 95);

      allies.forEach(a => {
        if (a.timer > 0) a.timer--;
        const t = enemies.find(e => a.x >= e.x && a.x - e.x <= a.range);
        if (t) {
          if (a.timer === 0) {
            if (a.label === '織田') bullets.push({ x: a.x - 15, y: a.y, t, atk: a.atk });
            else t.hp -= a.atk;
            a.timer = a.cd;
          }
        } else if (a.x - 80 <= a.range) {
          if (a.timer === 0) { enemyHp -= a.atk; a.timer = a.cd; }
        } else a.x -= a.speed;
        drawUnit(a, true);
      });

      enemies.forEach(e => {
        if (e.timer > 0) e.timer--;
        const t = allies.find(a => a.x >= e.x && a.x - e.x <= e.range);
        if (t) {
          if (e.timer === 0) { t.hp -= e.atk; e.timer = e.cd; }
        } else if (620 - e.x <= e.range) {
          if (e.timer === 0) { playerHp -= e.atk; e.timer = e.cd; }
        } else e.x += e.speed;
        drawUnit(e, false);
      });

      ctx.fillStyle = '#ffd32a';
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i]; b.x -= 10;
        ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI * 2); ctx.fill();
        if (b.t && b.x <= b.t.x) { b.t.hp -= b.atk; bullets.splice(i, 1); }
        else if (b.x < 0) bullets.splice(i, 1);
      }

      allies = allies.filter(a => a.hp > 0);
      enemies = enemies.filter(e => e.hp > 0);

      if (enemyHp <= 0 || playerHp <= 0) {
        gameOver = true;
        ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, 700, 250);
        ctx.fillStyle = '#ffd32a'; ctx.font = 'bold 30px sans-serif';
        ctx.fillText(enemyHp <= 0 ? '連合軍の勝利！' : '武田軍に敗北…', 350, 125);
        document.getElementById('restartBtn').style.display = 'block';
        return;
      }
      requestAnimationFrame(loop);
    }
    init();
  </script>
</body>
</html>
